<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <defs>
    <linearGradient id="cscDropletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7EA9"/>
      <stop offset="50%" stop-color="#FF5B99"/>
      <stop offset="100%" stop-color="#E83F7D"/>
    </linearGradient>
    <radialGradient id="cscBlushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB3CD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB3CD" stop-opacity="0"/>
    </radialGradient>
    <filter id="cscSoftShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#FF5B99" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Soft Circular Background Disc -->
  <circle cx="50" cy="50" r="47" fill="#FFF5F8" stroke="#FFE0EB" stroke-width="2"/>

  <!-- Kawaii Droplet Silhouette with Soft Shadow -->
  <path d="M 50 14 C 50 14 24 44 24 62 C 24 76.5 35.5 87 50 87 C 64.5 87 76 76.5 76 62 C 76 44 50 14 50 14 Z"
        fill="url(#cscDropletGrad)"
        filter="url(#cscSoftShadow)"/>

  <!-- Soft Specular Light Highlights -->
  <path d="M 36 46 C 31 53 31 63 36 71"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3.5"
        stroke-linecap="round"
        opacity="0.6"/>
  <circle cx="34" cy="42" r="2.2" fill="#FFFFFF" opacity="0.75"/>

  <!-- Cute Expressive Eyes (Joyful Smiling Arcs) -->
  <path d="M 40 60 C 41.5 57 44.5 57 46 60"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"/>
  <path d="M 54 60 C 55.5 57 58.5 57 60 60"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Rosy Blushing Cheeks -->
  <ellipse cx="37" cy="65" rx="4.5" ry="3" fill="#FFA5C3" opacity="0.9"/>
  <ellipse cx="63" cy="65" rx="4.5" ry="3" fill="#FFA5C3" opacity="0.9"/>

  <!-- Tiny Sweet Smile -->
  <path d="M 47.5 65.5 Q 50 68 52.5 65.5"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Little Heart or Sparkle on Top -->
  <path d="M 68 28 C 66 26 63 27 63 29 C 63 31 66 34 68 35 C 70 34 73 31 73 29 C 73 27 70 26 68 28 Z"
        fill="#FFD6E5"/>
</svg>
