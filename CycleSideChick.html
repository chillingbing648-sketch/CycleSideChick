<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF5F7" id="meta-theme">
<title>CycleSideChick — Cycle &amp; Wellness Companion</title>
<link rel="icon" id="fv" type="image/svg+xml" href="./public/favicon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CycleSideChick — Design Tokens & Soft Semantic Color System
   ========================================================================== */
:root {
  --font: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Base Light Theme — Warm off-white surfaces, never harsh #FFFFFF */
  --bg: #FAF5F7;
  --surface: #FDF9FA;
  --surface-alt: #F7EDF2;
  --surface-elevated: #FFFFFF;
  --surface-soft: #FFF4F8;
  --plum: #481930;
  --ink: #281822;
  --muted: #786470;
  --subtle: #A2909C;
  --border: #ECDBE3;
  --border-subtle: rgba(72, 25, 48, 0.08);

  /* Primary Brand Accent (Used for Primary Actions Only) */
  --pink: #D9447E;
  --pink-hover: #C5356E;
  --pink-light: #FDEBF2;
  --pink-border: #F7BFD5;
  --pink-glow: rgba(217, 68, 126, 0.22);
  --rose: #C68196;
  --nav-bg: rgba(253, 249, 250, 0.94);

  /* Soft Semantic Tints — Light (All reach >= 4.5:1 text contrast) */
  --tint-rose-bg: #FBE3EA;
  --tint-rose-text: #7D2342;
  --tint-rose-border: #F3C5D3;

  --tint-lavender-bg: #EFE6F7;
  --tint-lavender-text: #532E77;
  --tint-lavender-border: #DEC8EE;

  --tint-butter-bg: #FFF3C4;
  --tint-butter-text: #664E00;
  --tint-butter-border: #F7E188;

  --tint-amber-bg: #FBE0B0;
  --tint-amber-text: #7A4400;
  --tint-amber-border: #F5C679;

  --tint-sage-bg: #DDE8D5;
  --tint-sage-text: #265231;
  --tint-sage-border: #BED2B2;

  --tint-mint-bg: #D3EDE3;
  --tint-mint-text: #1A573F;
  --tint-mint-border: #A7DCB9;

  --tint-sky-bg: #DCEBF6;
  --tint-sky-text: #194B73;
  --tint-sky-border: #BAD8EF;

  --tint-peach-bg: #FADCCB;
  --tint-peach-text: #773B1B;
  --tint-peach-border: #F3BF9F;

  /* Shadows & Radii */
  --card-shadow: 0 4px 18px -2px rgba(72, 25, 48, 0.05), 0 1px 3px rgba(72, 25, 48, 0.03);
  --card-shadow-hover: 0 8px 24px -4px rgba(72, 25, 48, 0.08);
  --sheet-shadow: 0 -10px 36px rgba(72, 25, 48, 0.12);

  --radius-xl: 28px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --radius-pill: 9999px;

  color-scheme: light;
}

/* Layered Dark Mode — Layered surfaces (#17151B, #211D26, #2A2330) */
:root[data-theme="dark"],
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151B;
    --surface: #211D26;
    --surface-alt: #2A2330;
    --surface-elevated: #2E2736;
    --surface-soft: #2E2537;
    --plum: #F6EDF3;
    --ink: #EBE0EA;
    --muted: #A694A3;
    --subtle: #796877;
    --border: #352B3B;
    --border-subtle: rgba(246, 237, 243, 0.09);

    --pink: #EB6FA1;
    --pink-hover: #F286B2;
    --pink-light: #341B28;
    --pink-border: #5C2B42;
    --pink-glow: rgba(235, 111, 161, 0.28);
    --rose: #9C657A;
    --nav-bg: rgba(33, 29, 38, 0.94);

    /* Soft Semantic Tints — Dark (All reach >= 4.5:1 text contrast) */
    --tint-rose-bg: #2E2029;
    --tint-rose-text: #F8BAC9;
    --tint-rose-border: #4D3342;

    --tint-lavender-bg: #2A2330;
    --tint-lavender-text: #DCCBF0;
    --tint-lavender-border: #463753;

    --tint-butter-bg: #3A3322;
    --tint-butter-text: #FEE685;
    --tint-butter-border: #594D2C;

    --tint-amber-bg: #3F3120;
    --tint-amber-text: #FED085;
    --tint-amber-border: #5F472A;

    --tint-sage-bg: #25302A;
    --tint-sage-text: #B7E1C3;
    --tint-sage-border: #384F41;

    --tint-mint-bg: #223229;
    --tint-mint-text: #AEE2CF;
    --tint-mint-border: #335041;

    --tint-sky-bg: #212C38;
    --tint-sky-text: #B0D7F5;
    --tint-sky-border: #33485E;

    --tint-peach-bg: #3A2A26;
    --tint-peach-text: #F8BC9E;
    --tint-peach-border: #573B32;

    --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
    --card-shadow-hover: 0 8px 26px rgba(0, 0, 0, 0.38);
    --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);

    color-scheme: dark;
  }
}

/* High Contrast Accessibility Override */
@media (prefers-contrast: more) {
  :root {
    --border: #734F63;
    --border-subtle: #734F63;
    --ink: #000000;
    --muted: #482B3C;
  }
  :root[data-theme="dark"],
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --border: #DFCBD8;
      --border-subtle: #DFCBD8;
      --ink: #FFFFFF;
      --muted: #EADCE6;
    }
  }
  .card, .chip, .mood, .day {
    border-width: 2px !important;
  }
}


/* ==========================================================================
   CycleSideChick — Base Layout, Resets & Typography
   ========================================================================== */
html, body, button, input, select, textarea {
  font-family: var(--font);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-padding-top: 64px;
  transition: background-color 200ms ease, color 200ms ease;
}

@media (prefers-reduced-motion: no-preference) {
  html {
    scroll-behavior: smooth;
  }
}

body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top, 0px);
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 16px calc(108px + env(safe-area-inset-bottom, 0px));
}

h1, h2, h3, h4 {
  color: var(--plum);
  margin: 0;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.015em;
}

h1 { font-size: 26px; }
h2 { font-size: 22px; }
h3 { font-size: 17px; font-weight: 600; }
h4 { font-size: 15px; font-weight: 600; }
p { margin: 0.4em 0; }

.mut {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.45;
}

/* Soft Semantic Tint Component Classes */
.tint-rose { background: var(--tint-rose-bg); color: var(--tint-rose-text); border: 1px solid var(--tint-rose-border); }
.tint-lavender { background: var(--tint-lavender-bg); color: var(--tint-lavender-text); border: 1px solid var(--tint-lavender-border); }
.tint-butter { background: var(--tint-butter-bg); color: var(--tint-butter-text); border: 1px solid var(--tint-butter-border); }
.tint-amber { background: var(--tint-amber-bg); color: var(--tint-amber-text); border: 1px solid var(--tint-amber-border); }
.tint-sage { background: var(--tint-sage-bg); color: var(--tint-sage-text); border: 1px solid var(--tint-sage-border); }
.tint-mint { background: var(--tint-mint-bg); color: var(--tint-mint-text); border: 1px solid var(--tint-mint-border); }
.tint-sky { background: var(--tint-sky-bg); color: var(--tint-sky-text); border: 1px solid var(--tint-sky-border); }
.tint-peach { background: var(--tint-peach-bg); color: var(--tint-peach-text); border: 1px solid var(--tint-peach-border); }

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

/* Touch Targets: minimum 44px */
button, input, select, textarea, .chip, .mood, .day {
  min-height: 44px;
}

/* Accessibility: Reduced Motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}


/* ==========================================================================
   CycleSideChick — Component Styles
   ========================================================================== */

/* Top Header */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 2px 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.wm2 {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  color: var(--plum);
}

.icon {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--plum);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.icon:hover {
  background: var(--surface-alt);
}

.icon:active {
  transform: scale(0.92);
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--card-shadow);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
}

.card.card-interactive:hover {
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover);
}

/* Buttons */
.btn {
  background: var(--pink);
  color: #FFFFFF;
  border: 0;
  border-radius: var(--radius-pill);
  padding: 13px 22px;
  min-height: 48px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  cursor: pointer;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 14px var(--pink-glow);
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), background 0.15s ease, box-shadow 0.15s ease;
}

.btn:hover {
  background: var(--pink-hover);
}

.btn:active {
  transform: scale(0.97);
}

.btn.g {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--plum);
  box-shadow: none;
}

.btn.g:hover {
  background: var(--surface-alt);
  border-color: var(--rose);
}

.btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* Chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}

.chip {
  border: 1.5px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 8px 16px;
  min-height: 44px;
  background: var(--surface);
  color: var(--plum);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

.chip:hover {
  border-color: var(--pink-border);
  background: var(--surface-soft);
}

.chip:active {
  transform: scale(0.96);
}

.chip[aria-pressed="true"] {
  background: var(--pink);
  border-color: var(--pink);
  color: #FFFFFF;
  box-shadow: 0 4px 12px var(--pink-glow);
}

/* Symptom 3-Level Dots */
.dots {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 2px;
}

.dots i {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  transition: all 0.2s ease;
}

.dots i.on {
  background: currentColor;
}

.chip-sym[data-level="1"] {
  background: var(--tint-rose-bg);
  color: var(--tint-rose-text);
  border-color: var(--tint-rose-border);
}

.chip-sym[data-level="2"] {
  background: var(--tint-rose-bg);
  color: var(--tint-rose-text);
  border-color: var(--pink);
  font-weight: 700;
}

.chip-sym[data-level="3"] {
  background: var(--pink);
  border-color: var(--pink);
  color: #FFFFFF;
  box-shadow: 0 4px 12px var(--pink-glow);
  font-weight: 700;
}

/* Mood Row & Scroll-Snap */
.moods {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin: 10px 0;
  scroll-snap-type: x mandatory;
}

.mood {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 2px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--plum);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  min-height: 76px;
  min-width: 44px;
  scroll-snap-align: center;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.mood:hover {
  transform: translateY(-2px);
  border-color: var(--pink-border);
}

.mood:active {
  transform: scale(0.94);
}

.mood[aria-pressed="true"] {
  background: var(--tint-peach-bg);
  border-color: var(--tint-peach-border);
  color: var(--tint-peach-text);
  box-shadow: 0 4px 14px rgba(217, 68, 126, 0.18);
  transform: translateY(-2px) scale(1.03);
}

/* Week Strip Scroll-Snap */
.week-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 4px 2px 10px;
  margin: 4px 0 14px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.week-strip::-webkit-scrollbar { display: none; }

.week-day {
  flex: 0 0 calc((100% - 48px) / 7);
  min-width: 52px;
  min-height: 64px;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 2px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}

.week-day:hover {
  border-color: var(--rose);
}

.week-day.active {
  border-color: var(--plum);
  background: var(--surface-alt);
  box-shadow: 0 2px 8px var(--pink-glow);
  transform: translateY(-2px);
}

.week-day.today {
  box-shadow: 0 0 0 2px var(--pink) inset;
}

.week-day .wd-lbl {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
}

.week-day .wd-num {
  font-size: 16px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.week-day .wd-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

/* Cycle Ring */
.ring-wrap {
  position: relative;
  width: 220px;
  height: 220px;
  margin: 4px auto 14px;
}

.ring {
  width: 220px;
  height: 220px;
  display: block;
}

.ring circle {
  transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.3s ease;
}

.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.ring-cap {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
}

.ring-num {
  font-size: 42px;
  font-weight: 800;
  line-height: 1;
  color: var(--plum);
  margin: 2px 0;
  font-variant-numeric: tabular-nums;
}

.ring-sub {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}

.phase-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 700;
  background: var(--surface-alt);
  color: var(--plum);
  border: 1px solid var(--border);
  margin-bottom: 8px;
}

.big {
  font-size: 21px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--plum);
}

/* Input Fields & Forms */
label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  color: var(--plum);
  margin: 12px 0 6px;
}

input, select, textarea {
  width: 100%;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  min-height: 48px;
  box-sizing: border-box;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--pink);
  box-shadow: 0 0 0 3px var(--pink-glow);
}

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: var(--border);
  outline: none;
  padding: 0;
  margin: 12px 0;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--pink);
  border: 3px solid var(--surface);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  cursor: pointer;
  transition: transform 0.15s ease;
}

input[type="range"]::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

/* Calendar Month Grid */
.grid7 {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  text-align: center;
}

.grid7 b {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
  padding: 6px 0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.day {
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid transparent;
  background: none;
  color: var(--ink);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0;
  min-width: 44px;
  min-height: 44px;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

.day:hover {
  background: var(--surface-alt);
}

.day:active {
  transform: scale(0.9);
}

.day.c {
  background: var(--pink) !important;
  color: #FFFFFF !important;
  font-weight: 700;
  box-shadow: 0 3px 10px var(--pink-glow);
}

.day.p {
  border: 2px dashed var(--pink);
  background: var(--tint-rose-bg);
  color: var(--tint-rose-text);
  font-weight: 700;
}

.day.f {
  background: var(--tint-lavender-bg);
  color: var(--tint-lavender-text);
  border-color: var(--tint-lavender-border);
  font-weight: 600;
}

.day.t {
  box-shadow: 0 0 0 2px var(--plum) inset;
}

.day.s {
  outline: 2.5px solid var(--plum);
  outline-offset: 2px;
  transform: scale(1.08);
  z-index: 2;
}

.day.l::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 50%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
}

.day.c.l::after {
  background: #FFFFFF;
}

.leg {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.leg span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.leg i {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 50%;
}

/* Bottom Navigation Bar */
.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  margin: auto;
  max-width: 480px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--nav-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);

<script>
/**
 * CycleSideChick — Cycle Engine v2
 * High-accuracy, evidence-based, on-device cycle calculations.
 * Supports: natural, irregular, hormonal contraception, TTC, pregnancy, and perimenopause modes.
 */

const DAY = 864e5;

const N = s => {
  if (typeof s !== "string" || !s) return 0;
  const [a, b, c] = s.split("-");
  return Date.UTC(+a, +b - 1, +c) / DAY;
};

const I = n => new Date(n * DAY).toISOString().slice(0, 10);

const TD = () => {
  const t = new Date();
  return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY;
};

const fmt = (n, o = { month: "short", day: "numeric" }) =>
  new Date(n * DAY).toLocaleDateString(undefined, { ...o, timeZone: "UTC" });

const okD = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && I(N(s)) === s;

const vp = S => (S.periods || []).filter(p => okD(p.s) && N(p.s) <= TD());
const badP = S => (S.periods || []).filter(p => !(okD(p.s) && N(p.s) <= TD()));
const pEnd = (p, S) => (okD(p.e) && N(p.e) >= N(p.s) && N(p.e) <= TD()) ? N(p.e) : Math.min(N(p.s) + (S.pl || 5) - 1, Math.max(TD(), N(p.s)));

const pdset = S => {
  const s = new Set();
  vp(S).forEach(p => {
    for (let d = N(p.s); d <= pEnd(p, S); d++) s.add(d);
  });
  return s;
};

/**
 * Calculates cycle statistics using recency-weighted mean or median when outliers exist.
 */
function calculateStats(S) {
  const validPeriods = vp(S);
  const st = [...new Set(validPeriods.map(p => N(p.s)))].sort((a, b) => a - b);
  const lens = [];
  const gaps = [];

  for (let i = 1; i < st.length; i++) {
    const l = st[i] - st[i - 1];
    if (l >= 15 && l <= 90) {
      lens.push(l);
    } else if (l > 90) {
      gaps.push({ from: I(st[i - 1]), to: I(st[i]), days: l });
    }
  }

  const r = lens.slice(-6); // Up to last 6 valid cycles
  const n = r.length;
  let A = S.cl || 28;
  let sd = 2;
  let outlierDetected = false;

  if (n > 0) {
    const sorted = [...r].sort((a, b) => a - b);
    const median = n % 2 === 1 ? sorted[Math.floor(n / 2)] : Math.round((sorted[n / 2 - 1] + sorted[n / 2]) / 2);
    const minVal = sorted[0];
    const maxVal = sorted[sorted.length - 1];

    // Outlier detection: cycle differing from median by >= 10 days or wide spread (>= 12 days)
    const hasOutlier = sorted.some(v => Math.abs(v - median) >= 10) || (maxVal - minVal >= 12);
    if (n >= 3 && hasOutlier) {
      outlierDetected = true;
      A = median;
    } else {
      // Recency-weighted mean
      let totalW = 0;
      let weightedSum = 0;
      for (let i = 0; i < n; i++) {
        const w = 1 + (i / Math.max(1, n - 1)) * 0.8;
        totalW += w;
        weightedSum += r[i] * w;
      }
      A = Math.round(weightedSum / totalW);
    }

    if (n > 1) {
      sd = Math.sqrt(r.reduce((acc, val) => acc + (val - A) ** 2, 0) / n);
    } else {
      sd = S.mode === "irregular" ? 5 : 2;
    }
  } else {
    sd = S.mode === "irregular" ? 5 : 2;
  }

  if (S.mode === "irregular") sd = Math.max(sd, 4);

  // Prediction range: ±max(1, round(SD)), capped at ±7 days
  const pm = Math.min(7, Math.max(1, Math.round(sd)));

  // Clinical confidence evaluation
  let confLevel = "Low";
  let confReason = "";
  if (n < 3) {
    confLevel = "Low";
    confReason = n === 0 ? "No recorded cycles yet; using profile setting." : `Based on only ${n} recorded cycle${n > 1 ? "s" : ""}.`;
  } else if (sd > 5) {
    confLevel = "Low";
    confReason = `Cycle lengths vary noticeably (SD ±${Math.round(sd)}d).`;
  } else if (n >= 6 && sd <= 3) {
    confLevel = "Higher";
    confReason = `Steady pattern across ${n} cycles (SD ±${Math.round(sd)}d).`;
  } else {
    confLevel = "Moderate";
    confReason = `Based on ${n} cycles (${outlierDetected ? "median used due to outlier" : "recency-weighted"}).`;
  }

  const last = st.length ? st[st.length - 1] : null;
  const pred = [];
  if (last != null) {
    for (let k = 1; k <= 3; k++) pred.push(last + A * k);
  }

  // Adjustable luteal length (10-16d, default 14d)
  const ll = Math.max(10, Math.min(16, S.ll || 14));
  const nextPred = pred[0] || null;
  const estOvulation = nextPred ? nextPred - ll : null;
  const fertileStart = estOvulation ? estOvulation - 5 : null;
  const fertileEnd = estOvulation ? estOvulation + 1 : null;

  return {
    st,
    lens,
    gaps,
    avg: A,
    pm,
    sd,
    confLevel,
    confReason,
    last,
    pred,
    nextPred,
    ll,
    estOvulation,
    fertileStart,
    fertileEnd,
    n,
    outlierDetected
  };
}

/**
 * Pregnancy Calculations
 * Uses Naegele's rule (LMP + 280 days) or Conception date + 266 days.
 */
function calculatePregnancy(S) {
  const lmpStr = S.pregnancyLmp || (S.periods && S.periods.length ? S.periods[S.periods.length - 1].s : null);
  if (!lmpStr) return null;

  const lmpDays = N(lmpStr);
  const nowDays = TD();
  const daysAlong = Math.max(0, nowDays - lmpDays);
  const weeks = Math.floor(daysAlong / 7);
  const days = daysAlong % 7;
  const edd = lmpDays + 280; // Estimated due date

  let trimester = "First trimester";
  if (weeks >= 13 && weeks <= 27) trimester = "Second trimester";
  else if (weeks >= 28) trimester = "Third trimester";

  return {
    lmp: lmpStr,
    daysAlong,
    weeks,
    days,
    edd: I(edd),
    eddFormatted: fmt(edd, { month: "long", day: "numeric", year: "numeric" }),
    trimester
  };
}

/**
 * Plain-language "When to seek care" prompts triggered by the user's actual records.
 */
function checkCareAlerts(S) {
  const alerts = [];
  const x = calculateStats(S);
  const T = TD();

  // 1. Regular cycles < 21 or > 35 days
  if (x.n >= 2 && (x.avg < 21 || x.avg > 35)) {
    alerts.push(`Average cycle length is ${x.avg} days (typical physiological range is 21–35 days).`);
  }

  // 2. No period for 90+ days
  if (x.last != null && T - x.last > 90 && S.mode !== "pregnancy") {
    alerts.push(`No period start recorded for ${T - x.last} days (90+ days clinical threshold).`);
  }

  // 3. Bleeding > 7 days
  const longPeriod = vp(S).find(p => {
    const dur = pEnd(p, S) - N(p.s) + 1;
    return dur > 7;
  });
  if (longPeriod) {
    const dur = pEnd(longPeriod, S) - N(longPeriod.s) + 1;
    alerts.push(`Bleeding recorded for ${dur} consecutive days (longer than the typical 7-day duration).`);
  }

  // 4. Heavy flow on 3+ days
  let heavyDays = 0;
  Object.values(S.logs || {}).forEach(l => {
    if (l.f === "heavy") heavyDays++;
  });
  if (heavyDays >= 3) {
    alerts.push(`Heavy bleeding recorded on ${heavyDays} days. If soaking a pad or tampon hourly for 2+ consecutive hours, consult a clinician.`);
  }

  // 5. Severe pelvic pain (>= 8/10)
  let maxPain = 0;
  Object.values(S.logs || {}).forEach(l => {
    if (l.p != null && l.p > maxPain) maxPain = l.p;
  });
  if (maxPain >= 8) {
    alerts.push(`Severe pelvic pain (${maxPain}/10) recorded. Pain that stops daily activities warrants clinical evaluation.`);
  }

  return alerts;
}

/**
 * CycleSideChick — Storage, Privacy Ledger & Cryptographic Security
 * Zero cloud. 100% on-device storage. Salted PIN lock. Safe migrations.
 * Architectural layer: StorageRepository (decoupled from UI)
 */

const KEY = "csc.v1";
const PIN_SALT_KEY = "csc.pin.salt";
const PIN_HASH_KEY = "csc.pin.hash";
const SCHEMA_VERSION = 2;

const defState = () => ({
  _v: SCHEMA_VERSION,
  ob: 0,
  cl: 28,
  pl: 5,
  ll: 14,
  reg: "unknown",
  mode: "natural", // natural | irregular | contra | ttc | pregnancy | perimenopause | none
  pregnancyLmp: null,
  goals: [],
  rem: 0,
  periods: [],
  logs: {},
  custom: [],
  theme: "system",
  rp: 2,
  rt: "20:00",
  rk: { prep: 1, log: 1 },
  dis: {},
  sent: {},
  discreetNotif: 0
});

/**
 * Migration function for older schema versions
 */
function migrateState(data) {
  if (!data || typeof data !== "object") return defState();
  if (!data._v || data._v < 2) {
    data._v = SCHEMA_VERSION;
    if (!data.mode) {
      if (data.contra) data.mode = "contra";
      else if (data.reg === "irregular") data.mode = "irregular";
      else data.mode = "natural";
    }
    if (!data.ll) data.ll = 14;
    data.periods = Array.isArray(data.periods) ? data.periods : [];
    data.logs = (data.logs && typeof data.logs === "object") ? data.logs : {};
    data.custom = Array.isArray(data.custom) ? data.custom : [];
  }
  return { ...defState(), ...data };
}

/**
 * Safe local storage load with corruption fallback
 */
function loadState() {
  try {
    const raw = typeof localStorage !== "undefined" ? localStorage.getItem(KEY) : null;
    if (!raw) return { state: defState(), corrupt: false };
    const parsed = JSON.parse(raw);
    return { state: migrateState(parsed), corrupt: false };
  } catch (err) {
    console.error("Storage read exception:", err);
    try {
      if (typeof localStorage !== "undefined") {
        const rawCorrupt = localStorage.getItem(KEY);
        if (rawCorrupt) localStorage.setItem(KEY + ".corrupt_backup", rawCorrupt);
      }
    } catch (e) {}
    return { state: defState(), corrupt: true };
  }
}

function saveState(state) {
  try {
    if (typeof localStorage !== "undefined") {
      localStorage.setItem(KEY, JSON.stringify(state));
    }
  } catch (e) {
    console.error("Failed to save state to localStorage:", e);
  }
}

/**
 * Privacy Ledger: Audits all client-side storage keys and byte counts
 */
function getPrivacyLedger() {
  const items = [];
  try {
    if (typeof localStorage !== "undefined") {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("csc")) {
          const val = localStorage.getItem(k) || "";
          const bytes = new Blob([val]).size;
          let desc = "Application data";
          if (k === KEY) desc = "Cycle history, symptom logs, personal settings (Schema v2)";
          else if (k.includes("backup")) desc = "Local recovery safety backup";
          else if (k.includes("pin")) desc = "Salted cryptographic PIN hash for app lock";

          items.push({
            key: k,
            sizeBytes: bytes,
            sizeKB: (bytes / 1024).toFixed(2),
            description: desc
          });
        }
      }
    }
  } catch (e) {}
  return items;
}

/**
 * Salted PIN Hash verification & storage (Web Crypto API)
 */
async function hashPin(pin, saltHex) {
  if (typeof crypto === "undefined" || !crypto.subtle) {
    // Basic fallback for environments without web crypto (e.g. older headless)
    return { saltHex: saltHex || "salt00", hashHex: "mock_hash_" + pin };
  }
  const enc = new TextEncoder();
  const salt = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
  const pinData = enc.encode(pin);
  const combined = new Uint8Array(salt.length + pinData.length);
  combined.set(salt);
  combined.set(pinData, salt.length);

  const hashBuffer = await crypto.subtle.digest("SHA-256", combined);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");

  return {
    saltHex: bytesToHex(salt),
    hashHex
  };
}

function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
}

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bytes.length; i++) {
    bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return bytes;
}

async function verifyPin(pin, storedSaltHex, storedHashHex) {
  const { hashHex } = await hashPin(pin, storedSaltHex);
  return hashHex === storedHashHex;
}

/**
 * High-level PIN Lock Management
 */
const PinLock = {
  isEnabled() {
    try {
      return !!(typeof localStorage !== "undefined" && localStorage.getItem(PIN_HASH_KEY));
    } catch (e) {
      return false;
    }
  },
  async set(pin) {
    const { saltHex, hashHex } = await hashPin(pin);
    try {
      localStorage.setItem(PIN_SALT_KEY, saltHex);
      localStorage.setItem(PIN_HASH_KEY, hashHex);
      return true;
    } catch (e) {
      return false;
    }
  },
  async verify(pin) {
    try {
      const salt = localStorage.getItem(PIN_SALT_KEY);
      const hash = localStorage.getItem(PIN_HASH_KEY);
      if (!salt || !hash) return false;
      return await verifyPin(pin, salt, hash);
    } catch (e) {
      return false;
    }
  },
  remove() {
    try {
      localStorage.removeItem(PIN_SALT_KEY);
      localStorage.removeItem(PIN_HASH_KEY);
      return true;
    } catch (e) {
      return false;
    }
  }
};

/**
 * CSV Export Generator
 */
function generateCSV(S) {
  const headers = [
    "Date", "Entry_Type", "Bleeding_Flow", "Mood", "Pain_0_10",
    "Energy", "Sleep_Hours", "Sleep_Quality", "Hydration_Glasses", "Cervical_Mucus", "Medications",
    "BBT", "LH_Test", "Symptoms", "Notes"
  ];
  const rows = [];
  const dates = new Set([...Object.keys(S.logs || {})]);

  (S.periods || []).forEach(p => {
    if (p.s) dates.add(p.s);
    if (p.e) dates.add(p.e);
  });

  const sortedDates = [...dates].sort();

  sortedDates.forEach(d => {
    const l = (S.logs && S.logs[d]) || {};
    const symList = Object.entries(l.sy || {}).map(([k, v]) => `${k}:${["mild", "mod", "sev"][v - 1] || v}`).join("; ");
    const medsList = Array.isArray(l.med) ? l.med.join("; ") : (l.med || "");

    const row = [
      d,
      l.f && l.f !== "none" ? "Bleeding / Period" : "Daily Log",
      l.f || "",
      l.m != null ? l.m : "",
      l.p != null ? l.p : "",
      l.en || "",
      l.sl != null ? l.sl : "",
      l.sq || "",
      l.water || 0,
      l.cm || "",
      `"${medsList.replace(/"/g, '""')}"`,
      l.bbt || "",
      l.lh || "",
      `"${symList.replace(/"/g, '""')}"`,
      `"${(l.note || "").replace(/"/g, '""')}"`
    ];
    rows.push(row.join(","));
  });

  return [headers.join(","), ...rows].join("\r\n");
}

/**
 * JSON Export Generator
 */
function generateJSON(S) {
  const exported = {
    app: "CycleSideChick",
    version: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    data: S
  };
  return JSON.stringify(exported, null, 2);
}

/**
 * Import validation & conflict detection
 */
function previewImport(jsonOrCsvString, currentState) {
  try {
    let parsed = JSON.parse(jsonOrCsvString);
    if (parsed.data && parsed.app === "CycleSideChick") {
      parsed = parsed.data;
    }
    const incomingPeriods = Array.isArray(parsed.periods) ? parsed.periods : [];
    const incomingLogs = (parsed.logs && typeof parsed.logs === "object") ? parsed.logs : {};

    const existingStartDates = new Set((currentState.periods || []).map(p => p.s));
    let newPeriods = 0;
    let dupPeriods = 0;

    incomingPeriods.forEach(p => {
      if (existingStartDates.has(p.s)) dupPeriods++;
      else newPeriods++;
    });

    let newLogs = 0;
    let mergedLogs = 0;
    Object.keys(incomingLogs).forEach(d => {
      if ((currentState.logs || {})[d]) mergedLogs++;
      else newLogs++;
    });

    return {
      valid: true,
      newPeriods,
      dupPeriods,
      newLogs,
      mergedLogs,
      parsedData: parsed
    };
  } catch (e) {
    return { valid: false, error: "Invalid JSON format: please upload a valid CycleSideChick backup file." };
  }
}

/**
 * CycleStorage Repository — Abstract Data Access Layer
 * Enables decoupling the UI and easily substituting IndexedDB or encrypted storage.
 */
const CycleStorage = {
  load: loadState,
  save: saveState,
  getLedger: getPrivacyLedger,
  pin: PinLock,
  exportCSV: generateCSV,
  exportJSON: generateJSON,
  previewImport: previewImport,
  wipe() {
    try {
      localStorage.removeItem(KEY);
      localStorage.removeItem(PIN_SALT_KEY);
      localStorage.removeItem(PIN_HASH_KEY);
      return true;
    } catch (e) {
      return false;
    }
  }
};

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    KEY, SCHEMA_VERSION, defState, migrateState, loadState, saveState,
    getPrivacyLedger, hashPin, verifyPin, PinLock, generateCSV, generateJSON,
    previewImport, CycleStorage
  };
}

function searchArticles(query) {
  if (!query || !query.trim()) return ARTICLES;
  const q = query.toLowerCase().trim();
  return ARTICLES.filter(a =>
    a.title.toLowerCase().includes(q) ||
    a.summary.toLowerCase().includes(q) ||
    a.tags.some(t => t.toLowerCase().includes(q)) ||
    a.category.toLowerCase().includes(q)
  );
}

function getArticlesByTag(tag) {
  if (!tag) return ARTICLES;
  const t = tag.toLowerCase();
  return ARTICLES.filter(a => a.tags.some(x => x.toLowerCase() === t) || a.category.toLowerCase() === t);
}

function getRecommendedArticles(loggedSymptoms = {}, mode = "natural") {
  const symKeys = Object.keys(loggedSymptoms || {}).map(s => s.toLowerCase());
  const recs = [];

  if (mode === "pregnancy") {
    recs.push(...ARTICLES.filter(a => a.category === "Pregnancy"));
  } else if (mode === "perimenopause") {
    recs.push(...ARTICLES.filter(a => a.category === "Perimenopause"));
  } else if (mode === "ttc") {
    recs.push(...ARTICLES.filter(a => a.category === "Fertility" || a.category === "TTC"));
  } else if (mode === "contra") {
    recs.push(...ARTICLES.filter(a => a.category === "Contraception"));
  }

  if (symKeys.includes("cramps")) recs.push(...ARTICLES.filter(a => a.id === "dysmenorrhea-cramps" || a.id === "cramp-relief"));
  if (symKeys.includes("fatigue")) recs.push(...ARTICLES.filter(a => a.id === "iron-and-energy" || a.id === "sleep-and-hormones"));
  if (symKeys.includes("headache")) recs.push(...ARTICLES.filter(a => a.id === "estrogen-progesterone"));

  // Ensure unique articles
  const seen = new Set();
  const unique = [];
  recs.concat(ARTICLES).forEach(a => {
    if (!seen.has(a.id)) {
      seen.add(a.id);
      unique.push(a);
    }
  });

  return unique.slice(0, 4);
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    ARTICLES, searchArticles, getArticlesByTag, getRecommendedArticles
  };
}

/**
 * Interactive SVG Cycle Ring
 * Smooth circular progress visualization with distinct period and fertile phases.
 */
function ring(x, day, S) {
  const R = 62;
  const C = 2 * Math.PI * R;
  const A = x.avg || 28;
  const safeDay = Math.max(1, day);
  const ang = (Math.min(1, Math.max(0, (safeDay - 1) / A)) * 2 * Math.PI) - Math.PI / 2;
  const dotX = (80 + R * Math.cos(ang)).toFixed(1);
  const dotY = (80 + R * Math.sin(ang)).toFixed(1);

  const arc = (fromFrac, toFrac, color, width = 11, dash = "") => {
    const len = Math.max(0, toFrac - fromFrac) * C;
    const off = -fromFrac * C;
    return `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${color}" stroke-width="${width}" ${dash ? `stroke-dasharray="${dash}"` : `stroke-dasharray="${len} ${C}"`} stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 80 80)" class="ring-track-arc"/>`;
  };

  const periodFrac = Math.min(1, (S.pl || 5) / A);
  const showFertile = (S.mode === "natural" || S.mode === "ttc") && x.fertileStart && x.fertileEnd;
  const fertileStartFrac = showFertile ? Math.max(0, (x.fertileStart - (x.nextPred - A)) / A) : 0;
  const fertileEndFrac = showFertile ? Math.min(1, (x.fertileEnd - (x.nextPred - A)) / A) : 0;

  return `
    <div class="ring-wrap" role="img" aria-label="Cycle day ${safeDay} of estimated ${A} days">
      <svg viewBox="0 0 160 160" class="ring">
        <!-- Background Track -->
        <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--border-subtle)" stroke-width="11"/>
        <!-- Fertile Window Arc -->
        ${showFertile ? arc(fertileStartFrac, fertileEndFrac, "var(--tint-lavender-border)", 11) : ""}
        <!-- Period Flow Arc -->
        ${S.mode !== "none" ? arc(0, periodFrac, "var(--pink)", 11) : ""}
        <!-- Current Cycle Day Indicator Pulse -->
        <circle cx="${dotX}" cy="${dotY}" r="11" fill="var(--pink-glow)" class="ring-pulse-halo"/>
        <circle cx="${dotX}" cy="${dotY}" r="7.5" fill="var(--surface)" stroke="var(--plum)" stroke-width="3.5" class="ring-tracker-head"/>
      </svg>
      <div class="ring-center">
        <span class="ring-cap">Cycle Day</span>
        <span class="ring-num">${safeDay}</span>
        <span class="ring-sub">${S.mode === "none" ? "Logged Day" : "of ~" + A + " days"}</span>
      </div>
    </div>`;
}

if (typeof module !== "undefined" && module.exports) {

/* 10-Day Period Conflict Protection */
function ensurePeriod(dn) {
  if (dn > TD() || pdset(S).has(dn)) return;
  const prev = S.periods.filter(p => N(p.s) <= dn).sort((a, b) => N(a.s) - N(b.s)).pop();
  const nx = S.periods.find(p => N(p.s) > dn && N(p.s) - dn <= 3);

  if (nx) {
    nx.s = I(dn);
  } else if (prev && dn - N(prev.s) <= 10) {
    // Flag conflict modal if user attempts separate start within 10 days
    ui.conflict = { dn, existing: prev };
    return;
  } else {
    S.periods.push({ s: I(dn), e: null });
  }
  S.periods.sort((a, b) => N(a.s) - N(b.s));
}

/* Scroll & Caret Preservation Across Re-renders */
function beforeRender() {
  if (ui.tab) scrollPositions[ui.tab] = window.scrollY;
  const active = document.activeElement;
  return {
    id: active && active.id ? active.id : null,
    start: active && typeof active.selectionStart === "number" ? active.selectionStart : null,
    end: active && typeof active.selectionEnd === "number" ? active.selectionEnd : null,
    prevTab: ui.tab
  };
}

function afterRender(ctx) {
  if (ctx && ctx.prevTab === ui.tab && scrollPositions[ui.tab] != null) {
    window.scrollTo({ top: scrollPositions[ui.tab], behavior: "instant" });
  }
  if (ctx && ctx.id) {
    const el = document.getElementById(ctx.id);
    if (el) {
      el.focus();
      if (ctx.start !== null && ctx.end !== null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(ctx.start, ctx.end); } catch (e) {}
      }
    }
  }
}

          <button class="btn" style="max-width:240px" data-a="goLog" data-v="${I(T)}">Log daily pregnancy signs</button>
        </div>
      </div>
      ${renderMoodCard(L)}`;
  }

  // Perimenopause Hero
  if (S.mode === "perimenopause") {
    const guidance = getDailyPhaseGuidance("perimenopause");
    return `
      <div class="perimenopause-hero card tint-sage" style="text-align:center;padding:24px 20px">
        <div class="phase-art-wrap" style="margin-bottom:10px">${phaseArt("perimenopause", 64)}</div>
        <span class="phase-pill tint-sage">✦ Perimenopause Mode</span>
        <h2 style="margin:10px 0 4px">Hormonal Transition Rhythm</h2>
        <p class="mut" style="max-width:360px;margin:0 auto 16px">Cycles naturally fluctuate as ovarian activity shifts. Rigid ovulation estimates are turned off.</p>

        <div class="guidance-metric-row">
          <div class="guidance-metric">
            <b>Transition Comfort</b>
            <span>${guidance.selfCareTip}</span>
          </div>
          <div class="guidance-metric">
            <b>Active Strength</b>
            <span>${guidance.movement}</span>
          </div>
        </div>

        <div class="chips" style="justify-content:center;margin-top:16px">
          <button class="btn" style="max-width:240px" data-a="goLog" data-v="${I(T)}">Log symptoms &amp; hot flashes</button>
        </div>
      </div>
      ${renderMoodCard(L)}`;
  }

  // Clinical Red Flag Alert
  const clinicalPrompt = careAlerts.length ? `
    <div class="card tint-amber">
      <div class="row">
        <div style="display:flex;align-items:center;gap:8px">
          ${svgi("alert", 20)}
          <b>Pattern to Mention to a Healthcare Provider</b>
        </div>
      </div>
      <p class="mut" style="margin-top:6px">${careAlerts[0]}</p>
      <button class="btn g" style="margin-top:10px;min-height:40px;font-size:13px" data-a="openClinician">View clinician report</button>
    </div>` : "";

  // Week Strip
  let weekDaysHTML = "";
  for (let i = -3; i <= 3; i++) {
    const dNum = ui.sel + i;
    const isToday = dNum === T;
    const isSel = dNum === ui.sel;
    const hasPeriod = pdset(S).has(dNum);
    const hasLog = !!(S.logs && S.logs[I(dNum)]);
    const isFertile = (S.mode === "natural" || S.mode === "ttc") && x.fertileStart && dNum >= x.fertileStart && dNum <= x.fertileEnd;
    const dotColor = hasPeriod ? "var(--pink)" : isFertile ? "var(--tint-lavender-text)" : hasLog ? "var(--plum)" : "transparent";

    weekDaysHTML += `
      <div class="week-day ${isSel ? "active" : ""} ${isToday ? "today" : ""}" data-a="selDay" data-v="${dNum}">
        <span class="wd-lbl">${fmt(dNum, { weekday: "narrow" })}</span>
        <span class="wd-num">${new Date(dNum * DAY).getUTCDate()}</span>
        <span class="wd-dot" style="background:${dotColor}"></span>
      </div>`;
  }

  // Missing data empty state
  if (x.last == null) {
    return `
      ${renderGreeting(T)}
      ${clinicalPrompt}
      <div class="card" style="text-align:center;padding:28px 20px">
        <div class="phase-art-wrap" style="margin-bottom:12px">${bunny(64)}</div>
        <span class="phase-pill tint-sage">Setup Your History</span>
        <h2 style="margin:10px 0 6px">Begin your cycle record</h2>
        <p class="mut" style="max-width:340px;margin:0 auto 20px">Log the first day of your last period or set your known average cycle in Profile to enable personalized estimates.</p>
        <button class="btn" data-a="startToday">My period started today</button>
        <button class="btn g" style="margin-top:10px" data-a="tab" data-v="calendar">Pick past date on calendar</button>
      </div>
      ${renderMoodCard(L)}`;
  }

  const day = T - x.last + 1;
  const nx = x.pred[0];
  const until = nx - T;
  const late = -until;

  let est = "";
  let note = "";
  let phaseKey = "follicular";
  let phasePill = "";

  if (pdset(S).has(T)) {
    phaseKey = "menstrual";
    phasePill = `<span class="phase-pill tint-rose">🌸 Recorded Period Day</span>`;
  } else if ((S.mode === "natural" || S.mode === "ttc") && x.fertileStart && T >= x.fertileStart && T <= x.fertileEnd) {
    phaseKey = "fertile";
    phasePill = `<span class="phase-pill tint-lavender">✨ Estimated Fertile Window</span>`;
  } else if (day < x.avg - x.ll) {
    phaseKey = "follicular";
    phasePill = `<span class="phase-pill tint-sage">🌱 Follicular Phase</span>`;
  } else {
    phaseKey = "luteal";
    phasePill = `<span class="phase-pill tint-peach">🌙 Luteal Phase</span>`;
  }

  if (S.mode === "none") {
    est = `Cycle day <b>${day}</b> recorded`;
    note = "Predictions are turned off in your Profile settings.";
  } else if (S.mode === "contra") {
    est = `Day <b>${day}</b> of current cycle record`;
    note = "Hormonal contraception active; predictions and fertile window are hidden.";
  } else if (until >= 0) {
    est = `Next estimated period in about <b>${until} day${until == 1 ? "" : "s"}</b>`;
    note = `Estimated between ${fmt(nx - x.pm)} and ${fmt(nx + x.pm)} (±${x.pm}d · ${x.confLevel} confidence).`;
  } else {
    est = `Period is <b>${late} day${late == 1 ? "" : "s"}</b> past estimate`;
    note = `A late period has many common causes including stress, travel, illness, sleep changes, or natural variation.`;
  }

  const guidance = getDailyPhaseGuidance(phaseKey, day);

  // Compare to your usual insight
  const comp = compareToUsual(S);
  const compCard = comp.ready ? `
    <div class="card tint-sky" style="padding:16px">
      <div class="row">
        <b>Compare to Your Usual</b>
        <span class="chip" style="min-height:26px;padding:2px 8px;font-size:11.5px">Cycle Day ${comp.curCycleDay}</span>
      </div>
      <p class="mut" style="margin-top:4px;font-size:13px">
        Your current cycle is ${comp.cycleDiff === 0 ? "on track with your baseline" : comp.cycleDiff > 0 ? `${comp.cycleDiff} days longer than average` : `${Math.abs(comp.cycleDiff)} days shorter than average`}.
        ${comp.avgCurPain ? `Average recorded pain this cycle: ${comp.avgCurPain}/10.` : ""}
      </p>
    </div>` : "";

  return `
    ${renderGreeting(T)}
    ${clinicalPrompt}

    <div class="week-strip" role="region" aria-label="Current Week">
      ${weekDaysHTML}
    </div>

    <!-- Cycle Ring Dashboard Card -->
    <div class="card" style="text-align:center;padding:20px 16px">
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px">
        ${phasePill}
        <button class="info-btn" data-a="openInfo" data-v="${phaseKey}" aria-label="About ${guidance.name}">${svgi("info", 16)}</button>
      </div>
      ${ring(x, day, S)}
      <p class="big" style="margin:4px 0 6px">${est}</p>
      <p class="mut" style="max-width:380px;margin:0 auto;font-size:13px">${note}</p>
      <div style="margin-top:8px">
        <button class="chip" style="min-height:28px;padding:2px 10px;font-size:11.5px" data-a="openInfo" data-v="confidence">
          ${svgi("sparkle", 12)} Confidence: ${x.confLevel} (±${x.pm}d)
        </button>
      </div>
    </div>

    <!-- Daily Phase & Wellness Guidance Card -->
    <div class="card tint-mint phase-guidance-card">
      <div class="phase-art-wrap">${phaseArt(phaseKey, 54)}</div>
      <div>
        <h4 style="margin:0 0 2px;color:var(--plum)">${guidance.name}</h4>
        <p style="margin:0;font-size:12.5px;line-height:1.45;color:var(--plum)">${guidance.hormones}</p>
        <div style="margin-top:8px;font-size:12px;font-weight:600">
          💡 ${guidance.selfCareTip}
        </div>
      </div>
    </div>

    ${compCard}
    ${renderMoodCard(L)}

    <div class="chips" style="display:flex;gap:10px;margin-top:4px">
      ${until <= 2
        ? `<button class="btn" style="flex:1" data-a="startToday">Period started today</button>
           <button class="btn g" style="flex:1" data-a="goLog" data-v="${I(T)}">Log symptoms</button>`
        : `<button class="btn" style="flex:1" data-a="goLog" data-v="${I(T)}">Log mood &amp; symptoms</button>`
      }
    </div>`;
}

function renderGreeting(T) {
  const h = new Date().getHours();
  const greeting = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  return `
    <div style="margin-bottom:12px">
      <p class="mut" style="margin:0;font-weight:600">${fmt(T, { weekday: "long", month: "long", day: "numeric" })}</p>
      <h2>${greeting}</h2>
    </div>`;
}

function renderMoodCard(L) {
  const k = I(TD());
  if (L.m != null) {
    return `
      <div class="card tint-peach">
        <div class="row">
          <div style="display:flex;align-items:center;gap:12px">
            ${face(L.m, 42)}
            <div>
              <p style="margin:0;font-size:11px;text-transform:uppercase;font-weight:700">Today's Mood</p>
              <h3 style="margin:0">${MOODS[L.m].name}</h3>
              <p class="mut" style="margin:0;font-size:12px">${MOODS[L.m].sub}</p>
            </div>
          </div>
          <button class="chip" data-a="goLog" data-v="${k}">Edit entry</button>
        </div>
      </div>`;
  }
  return `
    <div class="card">
      <div class="row">
        <h3>How are you feeling today?</h3>
      </div>
      ${moods(null, "qm")}
    </div>`;
}

/* 3. Calendar View */
function renderCalendar() {
  const x = calculateStats(S);
  const T = TD();
  const { y, m } = ui.cm;
  const ps = pdset(S);
  const pr = new Set();
  const fe = new Set();

  if (S.mode !== "none" && S.mode !== "contra" && S.mode !== "pregnancy") {
    x.pred.forEach(p => {
      for (let d = p; d < p + (S.pl || 5); d++) if (d >= T) pr.add(d);
      if (S.mode !== "irregular" && x.fertileStart && x.fertileEnd) {
        for (let d = x.fertileStart; d <= x.fertileEnd; d++) fe.add(d);
      }
    });
  }

  const firstDay = new Date(Date.UTC(y, m, 1));
  const off = (firstDay.getUTCDay() + 6) % 7;
  const numDays = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();

  let cells = "<i></i>".repeat(off);
  for (let d = 1; d <= numDays; d++) {
    const n = Date.UTC(y, m, d) / DAY;
    const k = ps.has(n) ? "c" : pr.has(n) ? "p" : fe.has(n) ? "f" : "";
    const label = fmt(n, { weekday: "long", month: "long", day: "numeric" });

    cells += `
      <button class="day ${k} ${n == T ? "t" : ""} ${n == ui.sel ? "s" : ""} ${(S.logs && S.logs[I(n)]) ? "l" : ""}"
        data-a="day" data-v="${n}" aria-label="${label}">
        ${d}
      </button>`;
  }

  const sel = ui.sel;
  const rec = vp(S).find(p => N(p.s) <= sel && sel <= pEnd(p, S));
  const fut = sel > T;

  let st = "No period recorded.";
  if (rec) st = `Period day ${sel - N(rec.s) + 1}. Confirmed record.`;
  else if (pr.has(sel)) st = "Estimated period day (mathematical prediction).";
  else if (fe.has(sel)) st = "Estimated fertile window (approximation only).";

  const btns = rec
    ? `${sel > N(rec.s) && !fut ? `<button class="btn g" data-a="pend">Period ended this day</button>` : ""}
       <button class="btn g" data-a="prem">${ui.cf == "rm" ? "Tap again to remove period" : "Remove this period"}</button>`
    : `<button class="btn" data-a="pstart" ${fut ? "disabled" : ""}>Period started this day</button>`;

  const selLog = S.logs && S.logs[I(sel)];
  const logSnippet = selLog ? `
    <div style="margin:10px 0;padding:12px;background:var(--surface-alt);border-radius:var(--radius-sm);font-size:13px;line-height:1.5">
      ${selLog.m != null ? `<b>Mood:</b> ${MOODS[selLog.m].name} · ` : ""}
      ${selLog.f ? `<b>Flow:</b> ${selLog.f} · ` : ""}
      ${selLog.p != null ? `<b>Pain:</b> ${selLog.p}/10 · ` : ""}
      ${selLog.en ? `<b>Energy:</b> ${selLog.en} · ` : ""}
      ${selLog.water ? `<b>Hydration:</b> ${selLog.water} glasses · ` : ""}
      ${selLog.cm ? `<b>Cervical Fluid:</b> ${selLog.cm} · ` : ""}
      ${selLog.sl != null ? `<b>Sleep:</b> ${selLog.sl}h · ` : ""}
      ${Object.keys(selLog.sy || {}).length ? `<b>Symptoms:</b> ${Object.keys(selLog.sy).join(", ")}` : ""}
    </div>` : "";

  return `
    <div class="view-enter">
      <div class="card">
        <div class="row">
          <button class="icon" data-a="mo" data-v="-1" aria-label="Previous month">${svgi("arrowLeft", 18)}</button>
          <div style="text-align:center">
            <h2>${fmt(Date.UTC(y, m, 1) / DAY, { month: "long", year: "numeric" })}</h2>
          </div>
          <button class="icon" data-a="mo" data-v="1" aria-label="Next month">${svgi("arrowRight", 18)}</button>
        </div>

        <div class="grid7" style="margin-top:14px">
          ${["M", "T", "W", "T", "F", "S", "S"].map(d => `<b>${d}</b>`).join("")}
          ${cells}
        </div>

        <div class="leg">
          <span><i style="background:var(--pink)"></i> Confirmed period</span>
          <span><i style="border:2px dashed var(--pink);background:var(--tint-rose-bg)"></i> Predicted</span>
          <span><i style="background:var(--tint-lavender-bg);border:1px solid var(--tint-lavender-border)"></i> Estimated fertile</span>
          <span><i style="background:var(--plum);width:6px;height:6px"></i> Logged entry</span>
        </div>
      </div>

      <div class="card">
        <div class="row" style="margin-bottom:6px">
          <h3>${fmt(sel, { weekday: "long", month: "long", day: "numeric" })}</h3>
          ${sel == T ? `<span class="chip" style="min-height:30px;padding:4px 10px;font-size:12px">Today</span>` : ""}
        </div>
        <p class="mut">${st}${fut ? " Future dates cannot be logged." : ""}</p>
        ${logSnippet}
        <div class="chips" style="display:grid;gap:8px;margin-top:14px">
          ${btns}
          ${fut ? "" : `<button class="btn g" data-a="goLog" data-v="${I(sel)}">${svgi("log", 16)} Log symptoms &amp; health signs</button>`}
        </div>
      </div>
    </div>`;
}

      <div class="card">

/* 5. Insights View */
function renderInsights() {
  const x = calculateStats(S);
  const ls = x.lens.slice(-8);
  const durs = vp(S).filter(p => okD(p.e) && N(p.e) >= N(p.s)).map(p => N(p.e) - N(p.s) + 1);

  return `
    <div class="view-enter">
      <h2 style="margin-bottom:14px">Cycle Insights &amp; Health Patterns</h2>

      <div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px">
        <div class="tint-rose" style="padding:14px;border-radius:var(--radius-md);text-align:center">
          <span style="font-size:11.5px;text-transform:uppercase;font-weight:700">Recency Mean</span>
          <div style="font-size:24px;font-weight:800;margin-top:2px">${x.avg} <span style="font-size:14px;font-weight:600">days</span></div>
          <div style="font-size:12px;margin-top:2px">Range: ±${x.pm}d</div>
        </div>
        <div class="tint-sage" style="padding:14px;border-radius:var(--radius-md);text-align:center">
          <span style="font-size:11.5px;text-transform:uppercase;font-weight:700">Average Period</span>
          <div style="font-size:24px;font-weight:800;margin-top:2px">${durs.length ? (durs.reduce((a, b) => a + b) / durs.length).toFixed(1) : S.pl} <span style="font-size:14px;font-weight:600">days</span></div>
          <div style="font-size:12px;margin-top:2px">${durs.length} periods logged</div>
        </div>
      </div>

      <div class="card tint-lavender">
        <div class="row">
          <div style="display:flex;align-items:center;gap:8px">
            <b>Prediction Confidence: ${x.confLevel}</b>
            <button class="info-btn" data-a="openInfo" data-v="confidence">${svgi("info", 16)}</button>
          </div>
          <span class="chip" style="min-height:28px;padding:2px 8px;font-size:12px">${MODE_NAMES[S.mode] || S.mode}</span>
        </div>
        <p class="mut" style="margin-top:4px;font-size:13px">${x.confReason} Luteal length configured to ${x.ll} days.</p>
      </div>

      <!-- Follicular vs Luteal Breakdown -->
      <div class="card">

              const barW = 300 / ls.length;

/* Master Render Loop */
function render() {
  const ctx = beforeRender();
  const a = document.querySelector("#app");
  if (!a) return;

  if (ui.pinLocked) {
    a.innerHTML = renderPinLock();
    afterRender(ctx);
    return;
  }

  if (!S.ob) {
    a.innerHTML = onb();
    afterRender(ctx);
    return;
  }

  const views = {
    home: renderHome,
    calendar: renderCalendar,
    log: renderLog,
    insights: renderInsights,
    care: renderCare
  };

  const mainHTML = (views[ui.tab] || renderHome)();

  const NAVS = [
    ["home", "Home", "home"],
    ["calendar", "Calendar", "calendar"],
    ["log", "Log", "log"],
    ["insights", "Insights", "insights"],
    ["care", "Care", "care"]
  ];

  a.innerHTML = `
    <header class="top">
      <span class="brand">
        ${bunny(32, 0)}
        <b class="wm2">CycleSideChick</b>
      </span>
      <button class="icon" data-a="prof" aria-label="Profile and settings">${svgi("user", 20)}</button>
    </header>

    <main class="view-enter" key="${ui.tab}">
      ${mainHTML}
    </main>

    <nav class="nav" aria-label="Main Navigation">
      ${NAVS.map(([k, t, icon]) => {
        const isCenter = k === "log";
        const isActive = ui.tab === k;
        return `
          <button class="nav-btn ${isCenter ? "nav-btn-center" : ""}" data-a="tab" data-v="${k}" aria-current="${isActive ? "page" : "false"}">
            ${isCenter ? `<div class="nav-center-icon">${svgi(icon, 20)}</div>` : svgi(icon, 20)}
            <span>${t}</span>
          </button>`;
      }).join("")}
    </nav>

    ${ui.prof ? renderProfile() : ""}
    ${ui.activeArticle ? renderArticleModal() : ""}
    ${ui.partnerModal ? renderPartnerModal() : ""}
    ${ui.clinicianModal ? clinicianModal() : ""}
    ${ui.conflict ? conflictModal() : ""}
    ${ui.infoTopic ? renderInfoModal() : ""}`;

  afterRender(ctx);
}

/* Event Delegation & Actions */
const A = {
  tab: v => {
    if (ui.tab === v) return;
    scrollPositions[ui.tab] = window.scrollY;
    ui.tab = v;
    ui.cf = "";
    haptic(10);
  },
  selDay: v => {
    ui.sel = +v;
    haptic(10);
  },
  prof: () => {
    ui.prof = 1;
    haptic(10);
  },
  close: () => {
    ui.prof = 0;
    ui.cf = "";
    haptic(10);
  },
  openInfo: topic => {
    ui.infoTopic = topic;
    haptic(10);
  },
  closeInfo: () => {
    ui.infoTopic = null;
    haptic(10);
  },
  openClinician: () => {
    ui.clinicianModal = true;
    haptic(15);
  },
  closeClinician: () => {
    ui.clinicianModal = false;
    haptic(10);
  },
  copyClinician: async () => {
    const text = generateClinicianSummary(S);
    try {
      await navigator.clipboard.writeText(text);
      haptic([20, 40]);
      toast("Clinician summary copied");
    } catch (e) {
      toast("Summary ready to copy");
    }
  },
  conflictClose: () => {
    ui.conflict = null;
    haptic(10);
  },
  conflictSpotting: () => {
    if (ui.conflict) {
      const dn = ui.conflict.dn;
      const key = I(dn);
      S.logs[key] = { ...(S.logs[key] || {}), f: "spotting" };
      saveState(S);
      ui.conflict = null;
      haptic(20);
      toast("Logged as spotting on " + fmt(dn));
    }
  },
  conflictExtend: () => {
    if (ui.conflict) {
      const { dn, existing } = ui.conflict;
      existing.e = I(Math.max(dn, existing.e ? N(existing.e) : dn));
      saveState(S);
      ui.conflict = null;
      haptic([20, 40]);
      toast("Extended period to " + fmt(dn));
    }
  },
  openPartner: () => {
    ui.partnerModal = true;
    haptic(15);
  },
  closePartner: () => {
    ui.partnerModal = false;
    haptic(10);
  },
  copyPartnerLink: async () => {
    const x = calculateStats(S);
    const day = x.last ? TD() - x.last + 1 : 0;
    const text = `CycleSideChick Partner Snapshot: Current Cycle Day ${day}. Estimated next period in ~${x.nextPred ? Math.max(0, x.nextPred - TD()) : S.cl} days. Extra warmth and gentle rest appreciated today.`;
    try {
      await navigator.clipboard.writeText(text);
      haptic([20, 40]);
      toast("Partner snapshot copied");
    } catch (e) {}
  },
  readArticle: id => {
    ui.activeArticle = id;
    haptic(15);
  },
  closeArticle: () => {
    ui.activeArticle = null;
    haptic(10);
  },
  searchLib: (v, el) => {
    ui.articleSearch = el.value;
  },
  askAssistant: id => {
    const topic = ASSISTANT_TOPICS.find(t => t.id === id);
    if (topic) {
      ui.assistantResult = topic.answer(S, calculateStats(S));
      haptic(15);
    }
  },
  submitAssistant: () => {
    const input = document.querySelector("#assistantQueryInput");
    const q = input ? input.value : "";
    if (q) {
      ui.assistantResult = answerQuestion(q, S, calculateStats(S));
      haptic(15);
    }
  },
  setMode: v => {
    S.mode = v;
    saveState(S);
    haptic(15);
  },
  startToday: () => {
    const T = TD();
    ensurePeriod(T);
    saveState(S);
    haptic([20, 50, 20]);
    toast("Period start recorded");
  },
  qm: v => {
    const k = I(TD());
    S.logs[k] = { ...(S.logs[k] || {}), m: +v };
    saveState(S);
    haptic(20);
    toast("Mood saved: " + MOODS[v].name);
  },
  day: v => {
    ui.sel = +v;
    ui.cf = "";
    haptic(10);
  },
  mo: v => {
    let { y, m } = ui.cm;
    m += +v;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    ui.cm = { y, m };
    haptic(10);
  },
  pstart: () => {
    ensurePeriod(ui.sel);
    saveState(S);
    haptic([20, 40]);
    toast("Period start recorded");
  },
  pend: () => {
    const r = vp(S).find(p => N(p.s) <= ui.sel && ui.sel <= pEnd(p, S));
    if (r) {
      r.e = I(ui.sel);
      saveState(S);
      haptic([20, 40]);
      toast("Period end recorded");
    }
  },
  prem: () => {
    if (ui.cf != "rm") {
      ui.cf = "rm";
      haptic(15);
      return;
    }
    const r = vp(S).find(p => N(p.s) <= ui.sel && ui.sel <= pEnd(p, S));
    S.periods = S.periods.filter(p => p !== r);
    ui.cf = "";
    saveState(S);
    haptic([20, 40]);
    toast("Period removed");
  },
  goLog: v => {
    loadDraft(v);
    scrollPositions[ui.tab] = window.scrollY;
    ui.tab = "log";
    haptic(10);
  },
  quickDate: v => {
    loadDraft(v);
    haptic(10);
  },
  ldate: (v, b) => {
    loadDraft(b.value || I(TD()));
    haptic(10);
  },
  flow: v => {
    G.dr.f = G.dr.f == v ? "" : v;
    haptic(15);
  },
  dm: v => {
    G.dr.m = G.dr.m === +v ? null : +v;
    haptic(15);
  },
  energy: v => {
    G.dr.en = G.dr.en === v ? "" : v;
    haptic(15);
  },
  setWater: v => {
    G.dr.water = G.dr.water === +v ? 0 : +v;
    haptic(15);
  },
  cm: v => {
    G.dr.cm = G.dr.cm === v ? "" : v;
    haptic(15);
  },
  med: v => {
    const arr = G.dr.med;
    const i = arr.indexOf(v);
    i < 0 ? arr.push(v) : arr.splice(i, 1);
    haptic(15);
  },
  lh: v => {
    G.dr.lh = G.dr.lh === v ? "" : v;
    haptic(15);
  },
  sym: v => {
    const s = G.dr.sy;
    const n = ((s[v] || 0) + 1) % 4;
    n ? (s[v] = n) : delete s[v];
    haptic(15);
  },
  addc: () => {
    const e = document.querySelector("#cs");
    const v = e.value.trim().slice(0, 30);
    if (v && !["Cramps", "Headache", "Bloating", "Fatigue", "Breast tenderness", "Backache", ...S.custom].includes(v)) {
      S.custom.push(v);
      G.dr.sy[v] = 1;
      e.value = "";
      saveState(S);
      haptic([15, 30]);
      toast("Added: " + v);
    }
  },
  save: () => {
    const d = G.dr;
    const o = {
      m: d.m,
      p: d.p,
      en: d.en,
      sl: d.sl,
      sq: d.sq,
      water: d.water,
      cm: d.cm,
      med: d.med.length ? [...d.med] : undefined,
      bbt: d.bbt ? d.bbt.trim() : undefined,
      lh: d.lh || undefined,
      sy: { ...d.sy },
      note: d.note.trim(),
      f: d.f
    };
    S.logs[d.d] = o;
    if (o.f && o.f !== "none" && o.f !== "spotting") {
      ensurePeriod(N(d.d));
    }
    saveState(S);
    haptic([20, 60, 20]);
    toast("Entry saved for " + fmt(N(d.d)));
    ui.tab = "home";
  },
  th: v => {
    S.theme = v;
    saveState(S);
    applyTheme();
    haptic(15);
  },
  togglePin: async () => {
    if (PinLock.isEnabled()) {
      PinLock.remove();
      toast("App PIN lock removed");
    } else {
      const pin = prompt("Enter a 4-digit PIN for app lock:");
      if (pin && /^\d{4}$/.test(pin)) {
        await PinLock.set(pin);
        toast("4-Digit PIN lock enabled");
      } else if (pin) {
        alert("PIN must be exactly 4 numeric digits.");
      }
    }
    haptic(20);
  },
  pinKey: async v => {
    if (ui.pinEntered.length < 4) {
      ui.pinEntered += String(v);
      haptic(15);
      if (ui.pinEntered.length === 4) {
        const ok = await PinLock.verify(ui.pinEntered);
        if (ok) {
          ui.pinLocked = false;
          ui.pinEntered = "";
          haptic([20, 50]);
          toast("Unlocked");
        } else {
          haptic([40, 80, 40]);
          toast("Incorrect PIN");
          setTimeout(() => { ui.pinEntered = ""; render(); }, 300);
        }
      }
    }
  },
  pinDel: () => {
    ui.pinEntered = ui.pinEntered.slice(0, -1);
    haptic(10);
  },
  pinClear: () => {
    ui.pinEntered = "";
    haptic(10);
  },
  exportCSV: () => {
    const csv = generateCSV(S);
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `CycleSideChick_Export_${I(TD())}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("CSV export downloaded");
  },
  exportJSON: () => {
    const json = generateJSON(S);
    const blob = new Blob([json], { type: "application/json;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `CycleSideChick_Backup_${I(TD())}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("JSON backup downloaded");
  },
  wipe: () => {
    if (ui.cf != "wipe") {
      ui.cf = "wipe";
      haptic(20);
      return;
    }
    CycleStorage.wipe();
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, defState());
    applyTheme();
    ui.prof = 0;
    ui.cf = "";
    G.ob.step = 0;
    loadDraft(I(TD()));
    haptic([30, 60, 30]);
    toast("All data wiped");
  },
  next: () => {
    const o = G.ob;
    if (o.step == 1 && o.last) {
      ensurePeriod(N(o.last));
      S.cl = +o.cl || 28;
      S.pl = +o.pl || 5;
    }
    o.step++;
    haptic(15);
  },
  skip: () => {
    S.ob = 1;
    saveState(S);
    haptic(15);
    render();
  },
  setObMode: v => {
    G.ob.mode = v;
    haptic(15);
  },
  finishOb: () => {
    S.mode = G.ob.mode || "natural";
    S.ob = 1;
    saveState(S);
    haptic([20, 50, 20]);
    toast("Welcome to CycleSideChick");
    render();
  }
};

/* Event Listeners */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.tagName == "INPUT") return;
  const f = A[b.dataset.a];
  if (f) {
    f(b.dataset.v, b);
    if (!S.ob || (b.dataset.a !== "exportCSV" && b.dataset.a !== "exportJSON")) render();
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  const k = el.dataset.k;
  if (!k) return;
  let v = el.value;
  if (el.type === "number" || el.type === "range") v = +v;
  const p = k.split(".");
  let o = G;
  while (p.length > 1) o = o[p.shift()];
  o[p[0]] = v;
  if (el.dataset.out) {
    const target = document.getElementById(el.dataset.out);
    if (target) {
      if (k === "dr.p") target.textContent = v + "/10 · " + (v === 0 ? "No pain" : v <= 3 ? "Mild" : v <= 6 ? "Moderate" : v <= 8 ? "Severe" : "Very severe");
      else target.textContent = v + " h";
    }
  }
  if (k.startsWith("S.")) saveState(S);
  if (el.dataset.r) render();
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.a === "ldate") {
    loadDraft(el.value || I(TD()));
    render();
  }
});

function applyTheme() {
  const r = document.documentElement;
  const isDark = S.theme === "dark" || (S.theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if (S.theme == "light" || S.theme == "dark") r.dataset.theme = S.theme;
  else r.removeAttribute("data-theme");
  const meta = document.querySelector("#meta-theme");
  if (meta) meta.content = isDark ? "#17151B" : "#FAF5F7";
}

/* Initialization */
applyTheme();
render();


// PWA Service Worker Registration
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("ServiceWorker skipped:", err);
    });
  });
}
</script>
</body>
</html>
