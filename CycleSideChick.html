<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF5F7" id="meta-theme">
<title>CycleSideChick — Cycle &amp; Wellness Companion</title>
<link rel="icon" id="fv" type="image/svg+xml" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CycleSideChick — Design Tokens & Soft Semantic Color System
   ========================================================================== */
:root {
  --font: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  
  /* Light Theme — Warm off-white surfaces, never pure white */
  --bg: #FAF5F7;
  --surface: #FDF9FA;
  --surface-alt: #F7EDF2;
  --surface-elevated: #F8EDF3;
  --surface-soft: #FFF4F8;
  --plum: #481930;
  --ink: #281822;
  --muted: #786470;
  --subtle: #A2909C;
  --border: #ECDBE3;
  --border-subtle: rgba(72, 25, 48, 0.08);
  --pink: #D9447E;
  --pink-hover: #C5356E;
  --pink-light: #FDEBF2;
  --pink-border: #F7BFD5;
  --pink-glow: rgba(217, 68, 126, 0.22);
  --rose: #C68196;
  --nav-bg: rgba(253, 249, 250, 0.94);
  
  /* Soft Semantic Tints — Light (All reach >= 4.5:1 text contrast) */
  --tint-rose-bg: #FBE3EA;
  --tint-rose-text: #7D2342;
  --tint-rose-border: #F3C5D3;

  --tint-lavender-bg: #EFE6F7;
  --tint-lavender-text: #532E77;
  --tint-lavender-border: #DEC8EE;

  --tint-butter-bg: #FFF3C4;
  --tint-butter-text: #664E00;
  --tint-butter-border: #F7E188;

  --tint-amber-bg: #FBE0B0;
  --tint-amber-text: #7A4400;
  --tint-amber-border: #F5C679;

  --tint-sage-bg: #DDE8D5;
  --tint-sage-text: #265231;
  --tint-sage-border: #BED2B2;

  --tint-mint-bg: #D3EDE3;
  --tint-mint-text: #1A573F;
  --tint-mint-border: #A7DCB9;

  --tint-sky-bg: #DCEBF6;
  --tint-sky-text: #194B73;
  --tint-sky-border: #BAD8EF;

  --tint-peach-bg: #FADCCB;
  --tint-peach-text: #773B1B;
  --tint-peach-border: #F3BF9F;
  
  --card-shadow: 0 4px 18px -2px rgba(72, 25, 48, 0.05), 0 1px 3px rgba(72, 25, 48, 0.03);
  --card-shadow-hover: 0 8px 24px -4px rgba(72, 25, 48, 0.08);
  --sheet-shadow: 0 -10px 36px rgba(72, 25, 48, 0.12);
  
  --radius-xl: 28px;
  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --radius-pill: 9999px;
  
  color-scheme: light;
}

/* Dark Theme — Layered surfaces (#17151B, #211D26, #2A2330) */
:root[data-theme="dark"],
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151B;
    --surface: #211D26;
    --surface-alt: #2A2330;
    --surface-elevated: #2A2330;
    --surface-soft: #2E2537;
    --plum: #F6EDF3;
    --ink: #EBE0EA;
    --muted: #A694A3;
    --subtle: #796877;
    --border: #352B3B;
    --border-subtle: rgba(246, 237, 243, 0.09);
    --pink: #EB6FA1;
    --pink-hover: #F286B2;
    --pink-light: #341B28;
    --pink-border: #5C2B42;
    --pink-glow: rgba(235, 111, 161, 0.28);
    --rose: #9C657A;
    --nav-bg: rgba(33, 29, 38, 0.94);

    /* Soft Semantic Tints — Dark (All reach >= 4.5:1 text contrast) */
    --tint-rose-bg: #2E2029;
    --tint-rose-text: #F8BAC9;
    --tint-rose-border: #4D3342;

    --tint-lavender-bg: #2A2330;
    --tint-lavender-text: #DCCBF0;
    --tint-lavender-border: #463753;

    --tint-butter-bg: #3A3322;
    --tint-butter-text: #FEE685;
    --tint-butter-border: #594D2C;

    --tint-amber-bg: #3F3120;
    --tint-amber-text: #FED085;
    --tint-amber-border: #5F472A;

    --tint-sage-bg: #25302A;
    --tint-sage-text: #B7E1C3;
    --tint-sage-border: #384F41;

    --tint-mint-bg: #223229;
    --tint-mint-text: #AEE2CF;
    --tint-mint-border: #335041;

    --tint-sky-bg: #212C38;
    --tint-sky-text: #B0D7F5;
    --tint-sky-border: #33485E;

    --tint-peach-bg: #3A2A26;
    --tint-peach-text: #F8BC9E;
    --tint-peach-border: #573B32;
    
    --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
    --card-shadow-hover: 0 8px 26px rgba(0, 0, 0, 0.38);
    --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
    
    color-scheme: dark;
  }
}

/* High Contrast Accessibility Override */
@media (prefers-contrast: more) {
  :root {
    --border: #734F63;
    --border-subtle: #734F63;
    --ink: #000000;
    --muted: #482B3C;
  }
  :root[data-theme="dark"],
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --border: #DFCBD8;
      --border-subtle: #DFCBD8;
      --ink: #FFFFFF;
      --muted: #EADCE6;
    }
  }
  .card, .chip, .mood, .day {
    border-width: 2px !important;
  }
}

/* Global Typography & Inheritance */
html, body, button, input, select, textarea {
  font-family: var(--font);
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-padding-top: 64px;
  transition: background-color 200ms ease, color 200ms ease;
}

@media (prefers-reduced-motion: no-preference) {
  html {
    scroll-behavior: smooth;
  }
}

body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding-top: env(safe-area-inset-top, 0px);
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 14px 16px calc(100px + env(safe-area-inset-bottom, 0px));
}

h1, h2, h3, h4 {
  color: var(--plum);
  margin: 0;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.015em;
}

h1 { font-size: 26px; }
h2 { font-size: 22px; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0.4em 0; }

.mut {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.45;
}

/* Semantic Tint Helpers */
.tint-rose { background: var(--tint-rose-bg); color: var(--tint-rose-text); border: 1px solid var(--tint-rose-border); }
.tint-lavender { background: var(--tint-lavender-bg); color: var(--tint-lavender-text); border: 1px solid var(--tint-lavender-border); }
.tint-butter { background: var(--tint-butter-bg); color: var(--tint-butter-text); border: 1px solid var(--tint-butter-border); }
.tint-amber { background: var(--tint-amber-bg); color: var(--tint-amber-text); border: 1px solid var(--tint-amber-border); }
.tint-sage { background: var(--tint-sage-bg); color: var(--tint-sage-text); border: 1px solid var(--tint-sage-border); }
.tint-mint { background: var(--tint-mint-bg); color: var(--tint-mint-text); border: 1px solid var(--tint-mint-border); }
.tint-sky { background: var(--tint-sky-bg); color: var(--tint-sky-text); border: 1px solid var(--tint-sky-border); }
.tint-peach { background: var(--tint-peach-bg); color: var(--tint-peach-text); border: 1px solid var(--tint-peach-border); }

/* Header & Top Bar */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 2px 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.wm2 {
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  color: var(--plum);
}

.icon {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--plum);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.icon:hover {
  background: var(--surface-alt);
}

.icon:active {
  transform: scale(0.92);
}

/* Cards & Surfaces */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--card-shadow);
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
}

.card.card-interactive:hover {
  transform: translateY(-2px);
  box-shadow: var(--card-shadow-hover);
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

/* Buttons */
.btn {
  background: var(--pink);
  color: #FFFFFF;
  border: 0;
  border-radius: var(--radius-pill);
  padding: 13px 22px;
  min-height: 48px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
  cursor: pointer;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 14px var(--pink-glow);
  transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), background 0.15s ease, box-shadow 0.15s ease;
}

.btn:hover {
  background: var(--pink-hover);
}

.btn:active {
  transform: scale(0.97);
}

.btn.g {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--plum);
  box-shadow: none;
}

.btn.g:hover {
  background: var(--surface-alt);
  border-color: var(--rose);
}

.btn[disabled] {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}

/* Chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0;
}

.chip {
  border: 1.5px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 8px 16px;
  min-height: 44px;
  background: var(--surface);
  color: var(--plum);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

.chip:hover {
  border-color: var(--pink-border);
  background: var(--surface-soft);
}

.chip:active {
  transform: scale(0.96);
}

.chip[aria-pressed="true"] {
  background: var(--pink);
  border-color: var(--pink);
  color: #FFFFFF;
  box-shadow: 0 4px 12px var(--pink-glow);
}

/* Symptom Chip Intensity Indicators */
.dots {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 2px;
}

.dots i {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  transition: all 0.2s ease;
}

.dots i.on {
  background: currentColor;
}

.chip-sym[data-level="1"] {
  background: var(--tint-rose-bg);
  color: var(--tint-rose-text);
  border-color: var(--tint-rose-border);
}

.chip-sym[data-level="2"] {
  background: var(--tint-rose-bg);
  color: var(--tint-rose-text);
  border-color: var(--pink);
  font-weight: 700;
}

.chip-sym[data-level="3"] {
  background: var(--pink);
  border-color: var(--pink);
  color: #FFFFFF;
  box-shadow: 0 4px 12px var(--pink-glow);
  font-weight: 700;
}

/* Mood Row & Scroll-Snap */
.moods {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin: 10px 0;
  scroll-snap-type: x mandatory;
}

.mood {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 2px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--plum);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  min-height: 76px;
  min-width: 44px;
  scroll-snap-align: center;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.mood:hover {
  transform: translateY(-2px);
  border-color: var(--pink-border);
}

.mood:active {
  transform: scale(0.94);
}

.mood[aria-pressed="true"] {
  background: var(--tint-peach-bg);
  border-color: var(--tint-peach-border);
  color: var(--tint-peach-text);
  box-shadow: 0 4px 14px rgba(217, 68, 126, 0.18);
  transform: translateY(-2px) scale(1.03);
}

/* Week Strip Scroll-Snap */
.week-strip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 4px 2px 10px;
  margin: 4px 0 14px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.week-strip::-webkit-scrollbar { display: none; }

.week-day {
  flex: 0 0 calc((100% - 48px) / 7);
  min-width: 52px;
  min-height: 64px;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 6px 2px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}

.week-day:hover {
  border-color: var(--rose);
}

.week-day.active {
  border-color: var(--plum);
  background: var(--surface-alt);
  box-shadow: 0 2px 8px var(--pink-glow);
  transform: translateY(-2px);
}

.week-day.today {
  box-shadow: 0 0 0 2px var(--pink) inset;
}

.week-day .wd-lbl {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
}

.week-day .wd-num {
  font-size: 16px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.week-day .wd-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

/* Cycle Ring */
.ring-wrap {
  position: relative;
  width: 220px;
  height: 220px;
  margin: 4px auto 14px;
}

.ring {
  width: 220px;
  height: 220px;
  display: block;
}

.ring circle {
  transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.3s ease;
}

.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.ring-cap {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
}

.ring-num {
  font-size: 42px;
  font-weight: 800;
  line-height: 1;
  color: var(--plum);
  margin: 2px 0;
  font-variant-numeric: tabular-nums;
}

.ring-sub {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}

.phase-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 700;
  background: var(--surface-alt);
  color: var(--plum);
  border: 1px solid var(--border);
  margin-bottom: 8px;
}

.big {
  font-size: 21px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--plum);
}

/* Input Fields & Forms */
label {
  display: block;
  font-weight: 600;
  font-size: 14px;
  color: var(--plum);
  margin: 12px 0 6px;
}

input, select, textarea {
  width: 100%;
  font-size: 15px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  min-height: 48px;
  box-sizing: border-box;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--pink);
  box-shadow: 0 0 0 3px var(--pink-glow);
}

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 4px;
  background: var(--border);
  outline: none;
  padding: 0;
  margin: 12px 0;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--pink);
  border: 3px solid var(--surface);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  cursor: pointer;
  transition: transform 0.15s ease;
}

input[type="range"]::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

/* Calendar */
.grid7 {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  text-align: center;
}

.grid7 b {
  font-size: 12px;
  color: var(--muted);
  font-weight: 700;
  padding: 6px 0;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.day {
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid transparent;
  background: none;
  color: var(--ink);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0;
  min-width: 44px;
  min-height: 44px;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

.day:hover {
  background: var(--surface-alt);
}

.day:active {
  transform: scale(0.9);
}

.day.c {
  background: var(--pink) !important;
  color: #FFFFFF !important;
  font-weight: 700;
  box-shadow: 0 3px 10px var(--pink-glow);
}

.day.p {
  border: 2px dashed var(--pink);
  background: var(--tint-rose-bg);
  color: var(--tint-rose-text);
  font-weight: 700;
}

.day.f {
  background: var(--tint-lavender-bg);
  color: var(--tint-lavender-text);
  border-color: var(--tint-lavender-border);
  font-weight: 600;
}

.day.t {
  box-shadow: 0 0 0 2px var(--plum) inset;
}

.day.s {
  outline: 2.5px solid var(--plum);
  outline-offset: 2px;
  transform: scale(1.08);
  z-index: 2;
}

.day.l::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 50%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
}

.day.c.l::after {
  background: #FFFFFF;
}

.leg {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.leg span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.leg i {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 50%;
}

/* Care Grid */
.cares {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.cares .card {
  margin: 0;
  padding: 16px;
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Interactive Breathing Widget */
.breath-box {
  text-align: center;
  padding: 24px 16px;
}

.breath-circle {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--tint-rose-bg) 0%, var(--tint-lavender-bg) 100%);
  border: 3px solid var(--pink);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 16px auto;
  box-shadow: 0 0 30px var(--pink-glow);
  animation: breathAnim 8s infinite ease-in-out;
  transition: all 0.3s ease;
}

.breath-label {
  font-size: 15px;
  font-weight: 700;
  color: var(--plum);
}

@keyframes breathAnim {
  0%, 100% {
    transform: scale(0.85);

<script>
/* ==========================================================================
   CycleSideChick — Core Engine & Accurate Cycle Intelligence
   ========================================================================== */
const $ = s => document.querySelector(s);
const DAY = 864e5;
const KEY = "csc.v1";
const SCHEMA_VERSION = 2;

/* Date Utilities */
const N = s => {
  if (typeof s !== "string") return 0;
  const [a, b, c] = s.split("-");
  return Date.UTC(+a, +b - 1, +c) / DAY;
};

const I = n => new Date(n * DAY).toISOString().slice(0, 10);

const TD = () => {
  const t = new Date();
  return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY;
};

const fmt = (n, o = { month: "short", day: "numeric" }) =>
  new Date(n * DAY).toLocaleDateString(undefined, { ...o, timeZone: "UTC" });

const esc = s =>
  String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* Safe Haptic Feedback */
function haptic(pattern = 15) {
  try {
    if ('vibrate' in navigator && typeof navigator.vibrate === 'function') {
      navigator.vibrate(pattern);
    }
  } catch (e) {}
}

/* Default State Schema */
const def = () => ({
  _v: SCHEMA_VERSION,
  ob: 0,
  cl: 28,
  pl: 5,
  ll: 14, // Luteal phase length (10-16 days, default 14)
  reg: "unknown",
  mode: "natural", // natural | irregular | contra | ttc | none
  goals: [],
  contra: 0,
  rem: 0,
  periods: [],
  logs: {},
  custom: [],
  theme: "system",
  rp: 2,
  rt: "20:00",
  rk: { prep: 1, log: 1 },
  dis: {},
  sent: {}
});

/* Migration & Storage Recovery */
function migrate(data) {
  if (!data || typeof data !== "object") return def();
  // Schema v1 -> v2 migration
  if (!data._v || data._v < 2) {
    data._v = SCHEMA_VERSION;
    if (!data.mode) {
      if (data.contra) data.mode = "contra";
      else if (data.reg === "irregular") data.mode = "irregular";
      else data.mode = "natural";
    }
    if (!data.ll) data.ll = 14;
    data.periods = Array.isArray(data.periods) ? data.periods : [];
    data.logs = (data.logs && typeof data.logs === "object") ? data.logs : {};
    data.custom = Array.isArray(data.custom) ? data.custom : [];
  }
  return { ...def(), ...data };
}

let S;
let storageCorrupt = false;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const parsed = JSON.parse(raw);
    S = migrate(parsed);
  } else {
    S = def();
  }
} catch (e) {
  storageCorrupt = true;
  console.error("Storage corrupted. Entering recovery mode.", e);
  try {
    const rawCorrupt = localStorage.getItem(KEY);
    if (rawCorrupt) localStorage.setItem(KEY + ".corrupt_backup", rawCorrupt);
  } catch (ex) {}
  S = def();
}

const save = () => {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {}
};

/* Application State */
const t0 = new Date();
const G = { S };
const scrollPositions = { home: 0, calendar: 0, log: 0, insights: 0, care: 0 };

const ui = {
  tab: "home",
  cm: { y: t0.getFullYear(), m: t0.getMonth() },
  sel: TD(),
  prof: 0,
  cf: "",
  breath: 0,
  corrupt: storageCorrupt,
  conflict: null, // Period 10-day conflict modal state
  clinicianModal: false,
  importPreview: null
};

G.ob = { step: 0, last: "", cl: 28, pl: 5, reg: "unknown", mode: "natural", goals: [], rem: 0 };

const loadDraft = d => {
  const L = S.logs[d] || {};
  G.dr = {
    d,
    f: L.f || "",
    m: L.m ?? null,
    p: L.p ?? null,         // Pain 0-10
    en: L.en || "",         // Energy: low | balanced | high
    sl: L.sl ?? null,       // Sleep hours
    sq: L.sq || "",         // Sleep quality: restful | fair | restless | poor
    med: Array.isArray(L.med) ? [...L.med] : (L.med ? [L.med] : []), // Medication list
    bbt: L.bbt || "",       // Basal body temp
    lh: L.lh || "",         // LH test: none | neg | faint | pos
    sy: { ...(L.sy || {}) },
    note: L.note || ""
  };
};
loadDraft(I(TD()));

/* ==========================================================================
   Cycle Calculation & Accuracy Intelligence
   ========================================================================== */
const okD = s => typeof s == "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && I(N(s)) == s;
const vp = () => S.periods.filter(p => okD(p.s) && N(p.s) <= TD());
const badP = () => S.periods.filter(p => !(okD(p.s) && N(p.s) <= TD()));
const pEnd = p => (okD(p.e) && N(p.e) >= N(p.s) && N(p.e) <= TD()) ? N(p.e) : Math.min(N(p.s) + S.pl - 1, Math.max(TD(), N(p.s)));

const pdset = () => {
  const s = new Set();
  vp().forEach(p => {
    for (let d = N(p.s); d <= pEnd(p); d++) s.add(d);
  });
  return s;
};

/**
 * Enhanced cycle statistics engine:
 * - Recency-weighted mean of up to last 6 valid cycles (15-90 days)
 * - Median used when outliers exist
 * - Prediction range capped at ±max(1, round(SD)), max ±7
 * - Confidence level & reason (Low, Moderate, Higher)
 * - Adjustable luteal length (10-16d) -> estimated ovulation & fertile window
 * - Unusual cycle gaps flagged
 */
function stats() {
  const st = [...new Set(vp().map(p => N(p.s)))].sort((a, b) => a - b);
  const lens = [];
  const gaps = [];

  for (let i = 1; i < st.length; i++) {
    const l = st[i] - st[i - 1];
    if (l >= 15 && l <= 90) {
      lens.push(l);
    } else if (l > 90) {
      gaps.push({ from: I(st[i - 1]), to: I(st[i]), days: l });
    }
  }

  const r = lens.slice(-6); // Last up to 6 valid cycles
  const n = r.length;
  let A = S.cl;
  let sd = 2;
  let outlierDetected = false;

  if (n > 0) {
    const sorted = [...r].sort((a, b) => a - b);
    const median = n % 2 === 1 ? sorted[Math.floor(n / 2)] : Math.round((sorted[n / 2 - 1] + sorted[n / 2]) / 2);
    const minVal = sorted[0];
    const maxVal = sorted[sorted.length - 1];

    // Outlier detection: cycle differing from median by >= 10 days or wide spread (>= 12 days)
    const hasOutlier = sorted.some(v => Math.abs(v - median) >= 10) || (maxVal - minVal >= 12);
    if (n >= 3 && hasOutlier) {
      outlierDetected = true;
      A = median;
    } else {
      // Recency-weighted mean: weights scale linearly
      let totalW = 0;
      let weightedSum = 0;
      for (let i = 0; i < n; i++) {
        const w = 1 + (i / Math.max(1, n - 1)) * 0.8;
        totalW += w;
        weightedSum += r[i] * w;
      }
      A = Math.round(weightedSum / totalW);
    }

    if (n > 1) {
      sd = Math.sqrt(r.reduce((acc, val) => acc + (val - A) ** 2, 0) / n);
    } else {
      sd = S.mode === "irregular" ? 5 : 2;
    }
  } else {
    sd = S.mode === "irregular" ? 5 : 2;
  }

  if (S.mode === "irregular") sd = Math.max(sd, 4);

  // Range ±max(1, round(SD)), capped at ±7
  const pm = Math.min(7, Math.max(1, Math.round(sd)));

  // Confidence assessment with plain-language rationale
  let confLevel = "Low";
  let confReason = "";
  if (n < 3) {
    confLevel = "Low";
    confReason = n === 0 ? "No recorded cycles yet; using profile setting." : `Based on only ${n} recorded cycle${n > 1 ? "s" : ""}.`;
  } else if (sd > 5) {
    confLevel = "Low";
    confReason = `Cycle lengths vary noticeably (SD ±${Math.round(sd)}d).`;
  } else if (n >= 6 && sd <= 3) {
    confLevel = "Higher";
    confReason = `Steady pattern across ${n} cycles (SD ±${Math.round(sd)}d).`;
  } else {
    confLevel = "Moderate";
    confReason = `Based on ${n} cycles (${outlierDetected ? "median used due to outlier" : "recency-weighted"}).`;
  }

  const last = st.length ? st[st.length - 1] : null;
  const pred = [];
  if (last != null) {
    for (let k = 1; k <= 3; k++) pred.push(last + A * k);
  }

  // Estimated Ovulation: predicted period start minus luteal length
  const ll = Math.max(10, Math.min(16, S.ll || 14));
  const nextPred = pred[0] || null;
  const estOvulation = nextPred ? nextPred - ll : null;
  // Estimated Fertile Window: ovulation - 5 days to ovulation + 1 day
  const fertileStart = estOvulation ? estOvulation - 5 : null;
  const fertileEnd = estOvulation ? estOvulation + 1 : null;

  return {
    st,
    lens,
    gaps,
    avg: A,
    pm,
    sd,
    confLevel,
    confReason,
    last,
    pred,
    nextPred,
    ll,
    estOvulation,
    fertileStart,
    fertileEnd,
    n,
    outlierDetected
  };
}

/**
 * Period start validation & conflict handler:
 * Enforces the 10-day separation rule or triggers conflict resolution.
 */
function requestPeriodStart(dn) {
  if (dn > TD()) {
    toast("Future dates cannot be recorded as period starts");
    return;
  }
  const existingPeriods = vp();
  // Check for conflicts within 10 days
  const conflict = existingPeriods.find(p => Math.abs(dn - N(p.s)) < 10 && dn !== N(p.s));
  if (conflict) {
    ui.conflict = { dn, existing: conflict };
    render();
    return;
  }
  ensurePeriod(dn);
  save();
  haptic([20, 50, 20]);
  toast("Period start recorded");
  render();
}

function ensurePeriod(dn) {
  if (dn > TD() || pdset().has(dn)) return;
  const prev = S.periods.filter(p => N(p.s) <= dn).sort((a, b) => N(a.s) - N(b.s)).pop();
  const nx = S.periods.find(p => N(p.s) > dn && N(p.s) - dn <= 3);
  if (nx) {
    nx.s = I(dn);
  } else if (prev && dn - N(prev.s) <= 10) {
    prev.e = I(Math.max(dn, prev.e ? N(prev.e) : 0));
  } else {
    S.periods.push({ s: I(dn), e: null });
  }
  S.periods.sort((a, b) => N(a.s) - N(b.s));
}

/**
 * Plain-language "When to seek care" triggers based on user's own logs
 */
function checkCareAlerts() {
  const alerts = [];
  const x = stats();
  const T = TD();

  // 1. Regular cycles < 21 or > 35 days
  if (x.n >= 2 && (x.avg < 21 || x.avg > 35)) {
    alerts.push(`Average cycle length is ${x.avg} days (typical range is 21–35 days).`);
  }

  // 2. No period for 90+ days
  if (x.last != null && T - x.last > 90) {
    alerts.push(`No period start recorded for ${T - x.last} days (90+ days threshold).`);
  }

  // 3. Bleeding > 7 days
  const longPeriod = vp().find(p => {
    const dur = pEnd(p) - N(p.s) + 1;
    return dur > 7;
  });
  if (longPeriod) {
    const dur = pEnd(longPeriod) - N(longPeriod.s) + 1;
    alerts.push(`Bleeding recorded for ${dur} consecutive days (longer than the typical 7-day duration).`);
  }

  // 4. Soaking a pad/tampon hourly or persistent heavy flow
  let heavyDays = 0;
  Object.values(S.logs).forEach(l => {
    if (l.f === "heavy") heavyDays++;
  });
  if (heavyDays >= 3) {
    alerts.push(`Heavy bleeding recorded on ${heavyDays} days. If soaking a pad or tampon hourly for 2+ consecutive hours, contact a clinician.`);
  }

  // 5. Severe pain (pain >= 8)
  let maxPain = 0;
  Object.values(S.logs).forEach(l => {
    if (l.p != null && l.p > maxPain) maxPain = l.p;
  });
  if (maxPain >= 8) {
    alerts.push(`Severe pelvic pain (${maxPain}/10) recorded. Pain that stops daily activities warrants professional evaluation.`);
  }

  return alerts;
}

/* Clinician Summary Generator */
function generateClinicianSummary() {
  const x = stats();
  const alerts = checkCareAlerts();
  const recentPeriods = vp().slice(-6).reverse();

  let text = `=== CycleSideChick Health Summary ===\n`;
  text += `Generated: ${new Date().toLocaleDateString(undefined, { dateStyle: "long" })}\n`;
  text += `Tracking Mode: ${MODE_NAMES[S.mode] || S.mode}\n`;
  text += `Cycle Regularity: ${S.reg}\n\n`;

  text += `--- CYCLE PARAMETERS ---\n`;
  text += `• Estimated Average Cycle: ${x.avg} days (Recency-weighted mean)\n`;
  text += `• Cycle Variation: ±${x.pm} days (SD: ${x.sd.toFixed(1)}d · ${x.confLevel} confidence)\n`;
  text += `• Adjustable Luteal Length: ${x.ll} days\n`;
  text += `• Total Cycles Tracked: ${x.n}\n\n`;

  text += `--- RECENT PERIOD START DATES & DURATIONS ---\n`;
  if (recentPeriods.length) {
    recentPeriods.forEach(p => {
      const dur = pEnd(p) - N(p.s) + 1;
      text += `• ${p.s} to ${p.e || I(pEnd(p))} (${dur} days)\n`;
    });
  } else {
    text += `• No completed period dates recorded yet.\n`;
  }
  text += `\n`;

  text += `--- RECORDED SYMPTOM FREQUENCIES ---\n`;
  const symCounts = {};
  let totalPain = 0;
  let painEntries = 0;
  Object.values(S.logs).forEach(l => {
    Object.keys(l.sy || {}).forEach(k => {
      symCounts[k] = (symCounts[k] || 0) + 1;
    });
    if (l.p != null) {
      totalPain += l.p;
      painEntries++;
    }
  });
  const topSym = Object.entries(symCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (topSym.length) {
    topSym.forEach(([k, count]) => {
      text += `• ${k}: logged ${count} time(s)\n`;
    });
  } else {
    text += `• No symptoms logged yet.\n`;
  }
  if (painEntries > 0) {
    text += `• Average Pain Level: ${(totalPain / painEntries).toFixed(1)} / 10\n`;
  }
  text += `\n`;

  text += `--- CLINICAL ALERTS & PATTERNS ---\n`;
  if (alerts.length) {
    alerts.forEach(a => { text += `• ATTENTION: ${a}\n`; });
  } else {
    text += `• No red-flag criteria currently flagged in logs.\n`;
  }
  text += `\n(This summary is prepared for consultation with a licensed healthcare provider.)\n`;
  return text;
}

/* Interactive Cycle Ring with Tracking Mode Adaptations */
function ring(x, day) {
  const R = 62;
  const C = 2 * Math.PI * R;
  const A = x.avg || 28;
  const safeDay = Math.max(1, day);
  const ang = (Math.min(1, Math.max(0, (safeDay - 1) / A)) * 2 * Math.PI) - Math.PI / 2;
  const dotX = (80 + R * Math.cos(ang)).toFixed(1);
  const dotY = (80 + R * Math.sin(ang)).toFixed(1);

  const arc = (fromFrac, toFrac, color, width = 11) => {
    const len = Math.max(0, toFrac - fromFrac) * C;
    const off = -fromFrac * C;
    return `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${color}" stroke-width="${width}" stroke-dasharray="${len} ${C}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 80 80)"/>`;
  };

  const periodFrac = Math.min(1, S.pl / A);
  const showFertile = (S.mode === "natural" || S.mode === "ttc") && x.fertileStart && x.fertileEnd;
  const fertileStartFrac = showFertile ? Math.max(0, (x.fertileStart - (x.nextPred - A)) / A) : 0;
  const fertileEndFrac = showFertile ? Math.min(1, (x.fertileEnd - (x.nextPred - A)) / A) : 0;

  return `
    <div class="ring-wrap" role="img" aria-label="Cycle day ${safeDay} of estimated ${A} days">
      <svg viewBox="0 0 160 160" class="ring">
        <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--border-subtle)" stroke-width="11"/>
        ${showFertile ? arc(fertileStartFrac, fertileEndFrac, "var(--tint-lavender-text)", 11) : ""}
        ${S.mode !== "none" ? arc(0, periodFrac, "var(--pink)", 11) : ""}
        <circle cx="${dotX}" cy="${dotY}" r="7.5" fill="var(--surface)" stroke="var(--plum)" stroke-width="3.5"/>
      </svg>
      <div class="ring-center">
        <span class="ring-cap">Cycle Day</span>
        <span class="ring-num">${safeDay}</span>
        <span class="ring-sub">${S.mode === "none" ? "Logged Day" : "of ~" + A + " days"}</span>
      </div>
    </div>`;
}

function toast(m) {
  const t = $("#toast");
  t.innerHTML = `${svgi("check", 18)} <span>${m}</span>`;
  t.className = "on";
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.className = ""), 2600);
}

/* 2. Home Dashboard */
function home() {
  const x = stats();
  const T = TD();
  const L = S.logs[I(T)] || {};
  const bad = badP();
  const careAlerts = checkCareAlerts();

  // Storage recovery banner
  const corruptBanner = ui.corrupt ? `
    <div class="card tint-amber" role="alert">
      <div class="row">
        <b>Storage Recovery Notice</b>
      </div>
      <p class="mut">We encountered an issue reading previous records. A safe raw copy was preserved in backup storage.</p>
      <button class="btn g" style="margin-top:8px" data-a="dismissCorrupt">Dismiss notice</button>
    </div>` : "";

  // Bad dates banner
  const fixAlert = bad.length ? `
    <div class="card tint-amber" role="alert">
      <div class="row">
        <b>Date Check Required</b>
      </div>
      <p class="mut">${bad.length} saved period date${bad.length > 1 ? "s are" : " is"} in the future or improperly formatted. They are preserved in your records but excluded from forecasts.</p>
    </div>` : "";

  // Gaps banner
  const gapAlert = x.gaps.length ? `
    <div class="card tint-butter">
      <div class="row">
        <b>Unusual Cycle Gap Detected</b>
      </div>
      <p class="mut">A gap of ${x.gaps[0].days} days was recorded between ${fmt(N(x.gaps[0].from))} and ${fmt(N(x.gaps[0].to))}. It has been flagged without disturbing your valid predictions.</p>
    </div>` : "";

  // Clinician alerts banner
  const clinicalPrompt = careAlerts.length ? `
    <div class="card tint-amber">
      <div class="row">
        <div style="display:flex;align-items:center;gap:8px">
          ${svgi("alert", 20)}
          <b>Pattern to Mention to a Healthcare Provider</b>
        </div>
      </div>
      <p class="mut" style="margin-top:6px">${careAlerts[0]}</p>
      <button class="btn g" style="margin-top:10px;min-height:40px;font-size:13px" data-a="openClinician">View clinician summary</button>
    </div>` : "";

  // 7-day Week Strip (Center around selected date)
  let weekDaysHTML = "";
  for (let i = -3; i <= 3; i++) {
    const dNum = ui.sel + i;
    const isToday = dNum === T;
    const isSel = dNum === ui.sel;
    const hasPeriod = pdset().has(dNum);
    const hasLog = !!S.logs[I(dNum)];
    const isFertile = (S.mode === "natural" || S.mode === "ttc") && x.fertileStart && dNum >= x.fertileStart && dNum <= x.fertileEnd;
    const dotColor = hasPeriod ? "var(--pink)" : isFertile ? "var(--tint-lavender-text)" : hasLog ? "var(--plum)" : "transparent";

    weekDaysHTML += `
      <div class="week-day ${isSel ? "active" : ""} ${isToday ? "today" : ""}" data-a="selDay" data-v="${dNum}">
        <span class="wd-lbl">${fmt(dNum, { weekday: "narrow" })}</span>
        <span class="wd-num">${new Date(dNum * DAY).getUTCDate()}</span>
        <span class="wd-dot" style="background:${dotColor}"></span>
      </div>`;
  }

  // Missing data state (no defaults assumption)
  if (x.last == null) {
    return `
      ${gr(T)}
      ${corruptBanner}
      ${clinicalPrompt}
      <div class="card" style="text-align:center;padding:26px 20px">
        <span class="phase-pill tint-sage">Setup Your History</span>
        <h2 style="margin:10px 0 6px">Begin your cycle record</h2>
        <p class="mut" style="max-width:340px;margin:0 auto 18px">Log the first day of your last period or set your known average cycle in Profile to enable personalized estimates.</p>
        <button class="btn" data-a="startToday">My period started today</button>
        <button class="btn g" style="margin-top:10px" data-a="tab" data-v="calendar">Pick past date on calendar</button>
      </div>
      ${moodCard(L)}`;
  }

  const day = T - x.last + 1;
  const nx = x.pred[0];
  const until = nx - T;
  const late = -until;

  // Mode-aware forecast text
  let est = "";
  let note = "";
  if (S.mode === "none") {
    est = `Cycle day <b>${day}</b> recorded`;
    note = "Predictions are disabled in your settings.";
  } else if (S.mode === "contra") {
    est = `Day <b>${day}</b> of current cycle record`;
    note = "Hormonal contraception active; predictions and fertile window are hidden.";
  } else if (until >= 0) {
    est = `Next estimated period in about <b>${until} day${until == 1 ? "" : "s"}</b>`;
    note = `Estimated between ${fmt(nx - x.pm)} and ${fmt(nx + x.pm)} (±${x.pm}d · ${x.confLevel} confidence). ${x.confReason}`;
  } else {
    est = `Period is <b>${late} day${late == 1 ? "" : "s"}</b> past estimate`;
    note = `A late period has many common causes including stress, travel, illness, sleep disruption, or natural cycle variations.`;
  }

  // Phase computation with estimated qualifiers
  let phasePill = "";
  let phaseDesc = "";
  if (pdset().has(T)) {
    phasePill = `<span class="phase-pill tint-rose">🌸 Recorded Period Day</span>`;
    phaseDesc = "A confirmed period day. Listen to your body and rest when you need to.";
  } else if ((S.mode === "natural" || S.mode === "ttc") && x.fertileStart && T >= x.fertileStart && T <= x.fertileEnd) {
    phasePill = `<span class="phase-pill tint-lavender">✨ Estimated Fertile Window</span>`;
    phaseDesc = "Estimated window based on past cycle history. Mathematical approximation only; do not rely on for contraception.";
  } else if (day < x.avg - x.ll) {
    phasePill = `<span class="phase-pill tint-sage">🌱 Follicular Phase</span>`;
    phaseDesc = "Estrogen is gradually rising. Energy and focus often feel lighter.";
  } else {
    phasePill = `<span class="phase-pill tint-peach">🌙 Luteal Phase</span>`;
    phaseDesc = "Progesterone dominant. Prioritize warmth, steady nourishment, and restful boundaries.";
  }

  const prep = (until <= Math.max(S.rp, 3) && until >= -7 && S.dis.p != I(T)) ? `
    <div class="card tint-butter">
      <div class="row">
        <b>Preparation Notice</b>
        <button class="icon" style="width:34px;height:34px" data-a="dis" data-v="p" aria-label="Dismiss notification">${svgi("x", 16)}</button>
      </div>
      <p class="mut" style="margin-top:4px">${until >= 0 ? "Your period is estimated to arrive soon." : "Your period may start any day."} Keep supplies handy and take things gently.</p>
    </div>` : "";

  return `
    ${gr(T)}
    ${corruptBanner}
    ${fixAlert}
    ${gapAlert}
    ${clinicalPrompt}

    <div class="week-strip" role="region" aria-label="Current Week">
      ${weekDaysHTML}
    </div>

    <div class="card" style="text-align:center;padding:20px 16px">
      ${phasePill}
      ${ring(x, day)}
      <p class="big" style="margin:4px 0 6px">${est}</p>
      <p class="mut" style="max-width:380px;margin:0 auto">${note}</p>
    </div>

    <div class="card tint-mint">
      <p style="margin:0;font-size:14px;font-weight:600">${esc(phaseDesc)}</p>
    </div>

    ${prep}
    ${moodCard(L)}

    <div class="chips" style="display:flex;gap:10px">
      ${until <= 2
        ? `<button class="btn" style="flex:1" data-a="startToday">Period started today</button>
           <button class="btn g" style="flex:1" data-a="goLog" data-v="${I(T)}">Log symptoms</button>`
        : `<button class="btn" style="flex:1" data-a="goLog" data-v="${I(T)}">Log mood &amp; symptoms</button>`
      }
    </div>`;
}

/* 3. Calendar View */
function cal() {
  const x = stats();
  const T = TD();
  const { y, m } = ui.cm;
  const ps = pdset();
  const pr = new Set();
  const fe = new Set();

  if (S.mode !== "none" && S.mode !== "contra") {
    x.pred.forEach(p => {
      for (let d = p; d < p + S.pl; d++) if (d >= T) pr.add(d);
      if (S.mode !== "irregular" && x.fertileStart && x.fertileEnd) {
        for (let d = x.fertileStart; d <= x.fertileEnd; d++) fe.add(d);
      }
    });
  }

  const firstDay = new Date(Date.UTC(y, m, 1));
  const off = (firstDay.getUTCDay() + 6) % 7;
  const numDays = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();

  let cells = "<i></i>".repeat(off);
  for (let d = 1; d <= numDays; d++) {
    const n = Date.UTC(y, m, d) / DAY;
    const k = ps.has(n) ? "c" : pr.has(n) ? "p" : fe.has(n) ? "f" : "";
    const label = fmt(n, { weekday: "long", month: "long", day: "numeric" });
    const tag = ps.has(n) ? ", period recorded" : pr.has(n) ? ", predicted period" : fe.has(n) ? ", estimated fertile window" : "";

    cells += `
      <button class="day ${k} ${n == T ? "t" : ""} ${n == ui.sel ? "s" : ""} ${S.logs[I(n)] ? "l" : ""}"
        data-a="day" data-v="${n}" aria-label="${label}${tag}">
        ${d}
      </button>`;
  }

  const sel = ui.sel;
  const rec = vp().find(p => N(p.s) <= sel && sel <= pEnd(p));
  const fut = sel > T;

  let st = "No period recorded.";
  if (rec) {
    st = `Period day ${sel - N(rec.s) + 1}. Confirmed record.`;
  } else if (pr.has(sel)) {
    st = "Estimated period day (prediction, not a record).";
  } else if (fe.has(sel)) {
    st = "Estimated fertile window (approximation only).";
  }

  const btns = rec
    ? `${sel > N(rec.s) && !fut ? `<button class="btn g" data-a="pend">Period ended this day</button>` : ""}
       <button class="btn g" data-a="prem">${ui.cf == "rm" ? "Tap again to remove period" : "Remove this period"}</button>`
    : `<button class="btn" data-a="pstart" ${fut ? "disabled" : ""}>Period started this day</button>`;

  const selLog = S.logs[I(sel)];
  const logSnippet = selLog ? `
    <div style="margin:10px 0;padding:12px;background:var(--surface-alt);border-radius:var(--radius-sm);font-size:13.5px">
      ${selLog.m != null ? `<b>Mood:</b> ${MOODS[selLog.m].name} · ` : ""}
      ${selLog.f ? `<b>Flow:</b> ${selLog.f} · ` : ""}
      ${selLog.p != null ? `<b>Pain:</b> ${selLog.p}/10 · ` : ""}
      ${selLog.en ? `<b>Energy:</b> ${selLog.en} · ` : ""}
      ${selLog.sl != null ? `<b>Sleep:</b> ${selLog.sl}h · ` : ""}
      ${Object.keys(selLog.sy || {}).length ? `<b>Symptoms:</b> ${Object.keys(selLog.sy).join(", ")}` : ""}
    </div>` : "";

  return `
    <div class="view-enter">
      <div class="card">
        <div class="row">
          <button class="icon" data-a="mo" data-v="-1" aria-label="Previous month">${svgi("arrowLeft", 18)}</button>
          <div style="text-align:center">
            <h2>${fmt(Date.UTC(y, m, 1) / DAY, { month: "long", year: "numeric" })}</h2>
          </div>
          <button class="icon" data-a="mo" data-v="1" aria-label="Next month">${svgi("arrowRight", 18)}</button>
        </div>

        <div class="grid7" style="margin-top:14px">
          ${["M", "T", "W", "T", "F", "S", "S"].map(d => `<b>${d}</b>`).join("")}
          ${cells}
        </div>

/* 5. Insights View */
function patt() {
  const x = stats();
  const c = {};
  Object.entries(S.logs).forEach(([d, l]) => {
    const n = N(d);
    const s = x.st.filter(q => q <= n).pop();
    if (s == null || n - s > 90) return;
    const b = Math.min(3, [5, 13, 21].filter(z => n - s + 1 > z).length);
    Object.keys(l.sy || {}).forEach(k => {
      (c[k] = c[k] || [0, 0, 0, 0])[b]++;
    });
  });
  return Object.entries(c)
    .map(([k, a]) => ({ k, t: a.reduce((p, q) => p + q), b: a.indexOf(Math.max(...a)) }))
    .filter(r => r.t >= 3)
    .sort((a, b) => b.t - a.t);
}

const BL = [

  let h = `

  // Key stats overview cards
  h += `

        <div style="font-size:24px;font-weight:800;margin-top:2px">${durs.length ? (durs.reduce((a, b) => a + b) / durs.length).toFixed(1) : S.pl} <span style="font-size:14px;font-weight:600">days</span></div>
        <div style="font-size:12px;margin-top:2px">${durs.length} periods logged</div>
      </div>
    </div>`;

  // Confidence & Tracking Mode Banner
  h += `
    <div class="card tint-lavender">
      <div class="row">
        <b>Confidence: ${x.confLevel}</b>
        <span class="chip" style="min-height:28px;padding:2px 8px;font-size:12px">${MODE_NAMES[S.mode] || S.mode}</span>
      </div>
      <p class="mut" style="margin-top:4px">${x.confReason} Luteal length set to ${x.ll} days.</p>
    </div>`;

  if (ls.length < 2) {
    h += `
      <div class="card tint-mint" style="text-align:center;padding:24px 18px">
        <h3>Still learning your rhythm</h3>
        <p class="mut">Comprehensive cycle patterns emerge after at least 3 period start dates. You currently have ${n}.</p>
      </div>`;
  } else {
    const mx = Math.max(...ls, 35);
    const mn = Math.min(...ls);
    const chartW = 300;
    const barW = chartW / ls.length;

    h += `
      <div class="card">
        <div class="row" style="margin-bottom:8px">
          <h3>Recent cycle lengths</h3>
          <span class="chip" style="min-height:28px;padding:2px 10px;font-size:12px">Range: ${mn}–${Math.max(...ls)}d</span>
        </div>
        <p class="mut">Last ${ls.length} recorded cycles. ${x.outlierDetected ? "Outliers detected; median used for current forecasts." : "Calculated with recency weighting."}</p>
        <svg viewBox="0 0 300 130" role="img" aria-label="Cycle lengths chart" width="100%" style="margin-top:12px">
          <line x1="0" y1="105" x2="300" y2="105" stroke="var(--border)" stroke-width="1"/>
          ${ls.map((l, i) => {
            const bh = Math.max(10, (l / mx) * 85);
            const xPos = i * barW + 8;
            const w = barW - 16;
            return `
              <rect x="${xPos}" y="${105 - bh}" width="${w}" height="${bh}" rx="6" fill="var(--pink)"/>
              <text x="${xPos + w / 2}" y="${98 - bh}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--plum)">${l}</text>
              <text x="${xPos + w / 2}" y="122" text-anchor="middle" font-size="11" fill="var(--muted)">#${i + 1}</text>`;
          }).join("")}
        </svg>
      </div>`;
  }

  // Symptom patterns
  h += `
    <div class="card">
      <h3>Symptom occurrences</h3>
      <div style="margin-top:10px">
        ${pt.length
          ? pt.map(r => `

            ).join("") + `<p class="mut" style="margin-top:6px;font-size:12.5px">Personal observations from your logs, not clinical diagnosis.</p>`
          : `<p class="mut">Symptom trends will appear after an individual symptom has been logged at least 3 times.</p>`
        }
      </div>
    </div>`;

  h += `</div>`;
  return h;
}

function beforeRender() {
  if (ui.tab) scrollPositions[ui.tab] = window.scrollY;
  const active = document.activeElement;
  return {
    id: active && active.id ? active.id : null,
    start: active && typeof active.selectionStart === "number" ? active.selectionStart : null,
    end: active && typeof active.selectionEnd === "number" ? active.selectionEnd : null,

}

function afterRender(ctx) {
  if (ctx && ctx.prevTab === ui.tab && scrollPositions[ui.tab] != null) {
    window.scrollTo({ top: scrollPositions[ui.tab], behavior: "instant" });
  }
  if (ctx && ctx.id) {
    const el = document.getElementById(ctx.id);
    if (el) {
      el.focus();
      if (ctx.start !== null && ctx.end !== null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(ctx.start, ctx.end); } catch (e) {}
      }
    }
  }
}

function render() {
  const ctx = beforeRender();
  const a = $("#app");
  if (!S.ob) {
    a.innerHTML = onb();
    afterRender(ctx);
    return;
  }

  const screenHTML = { home, calendar: cal, log, insights, care }[ui.tab]();

  a.innerHTML = `
    <header class="top">
      <span class="brand">
        ${bunny(32, 0)}
        <b class="wm2">CycleSideChick</b>
      </span>
      <button class="icon" data-a="prof" aria-label="Profile and settings">${svgi("user", 20)}</button>
    </header>

    <main class="view-enter" key="${ui.tab}">
      ${screenHTML}
    </main>

    <nav class="nav" aria-label="Main Navigation">
      ${NAVS.map(([k, t, icon]) => {
        const isCenter = k === "log";
        const isActive = ui.tab === k;
        return `
          <button class="nav-btn ${isCenter ? "nav-btn-center" : ""}" data-a="tab" data-v="${k}" aria-current="${isActive ? "page" : "false"}">
            ${isCenter ? `<div class="nav-center-icon">${svgi(icon, 20)}</div>` : svgi(icon, 20)}
            <span>${t}</span>
          </button>`;
      }).join("")}
    </nav>

    ${ui.prof ? prof() : ""}
    ${ui.conflict ? conflictModal() : ""}
    ${ui.clinicianModal ? clinicianModal() : ""}`;

  afterRender(ctx);
}

/* ==========================================================================
   User Actions & Interactions
   ========================================================================== */
const tg = (arr, v) => {
  const i = arr.indexOf(v);
  i < 0 ? arr.push(v) : arr.splice(i, 1);
};

const A = {
  next: () => {
    haptic(15);
    G.ob.step++;
  },
  skip: () => {
    haptic(15);
    S.ob = 1;
    save();
  },
  reg: v => {
    haptic(15);
    G.ob.reg = v;
  },
  mode: v => {
    haptic(15);
    G.ob.mode = v;
  },
  setMode: v => {
    haptic(15);
    S.mode = v;
    save();
  },
  goal: v => {
    haptic(15);
    tg(G.ob.goals, v);
  },
  rem: () => {
    haptic(15);
    G.ob.rem = +!G.ob.rem;
    if (G.ob.rem) askNotif();
  },
  finish: () => {
    const o = G.ob;
    Object.assign(S, {
      cl: o.cl || 28,
      pl: o.pl || 5,
      reg: o.reg || "unknown",
      mode: o.mode || "natural",
      rem: o.rem || 0,
      ob: 1
    });
    if (o.last && N(o.last) <= TD()) S.periods = [{ s: o.last, e: null }];
    save();
    haptic([20, 60, 20]);
    toast("You’re all set!");
  },
  tab: v => {
    if (ui.tab === v) return;
    scrollPositions[ui.tab] = window.scrollY;
    ui.tab = v;
    ui.cf = "";
    haptic(10);
  },
  selDay: v => {
    ui.sel = +v;
    haptic(10);
  },
  prof: () => {
    haptic(10);
    ui.prof = 1;
  },
  close: () => {
    haptic(10);
    ui.prof = 0;
    ui.cf = "";
  },
  openClinician: () => {
    haptic(15);
    ui.clinicianModal = true;
  },
  closeClinician: () => {
    haptic(10);
    ui.clinicianModal = false;
  },
  copyClinician: async () => {
    const text = generateClinicianSummary();
    try {
      await navigator.clipboard.writeText(text);
      haptic([20, 40]);
      toast("Clinician summary copied");
    } catch (e) {
      toast("Press copy on selected text");
    }
  },
  dismissCorrupt: () => {
    ui.corrupt = false;
  },
  startToday: () => {
    requestPeriodStart(TD());
  },
  qm: v => {
    const k = I(TD());
    S.logs[k] = { ...(S.logs[k] || {}), m: +v };
    save();
    haptic(20);
    toast("Mood saved: " + MOODS[v].name);
  },
  day: v => {
    ui.sel = +v;
    ui.cf = "";
    haptic(10);
  },
  mo: v => {
    let { y, m } = ui.cm;
    m += +v;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    ui.cm = { y, m };
    haptic(10);
  },
  pstart: () => {
    requestPeriodStart(ui.sel);
  },
  pend: () => {
    const r = S.periods.find(p => N(p.s) <= ui.sel && ui.sel <= pEnd(p));
    if (r) {
      r.e = I(ui.sel);
      save();
      haptic([20, 40]);
      toast("Period end recorded");
    }
  },
  prem: () => {
    if (ui.cf != "rm") {
      ui.cf = "rm";
      haptic(15);
      return;
    }
    const r = S.periods.find(p => N(p.s) <= ui.sel && ui.sel <= pEnd(p));
    S.periods = S.periods.filter(p => p !== r);
    ui.cf = "";
    save();
    haptic([20, 40]);
    toast("Period removed");
  },
  conflictSpotting: () => {
    if (!ui.conflict) return;
    const { dn } = ui.conflict;
    const k = I(dn);
    S.logs[k] = { ...(S.logs[k] || {}), f: "spotting" };
    save();
    ui.conflict = null;
    haptic(15);
    toast("Recorded as Spotting");
  },
  conflictExtend: () => {
    if (!ui.conflict) return;
    const { dn, existing } = ui.conflict;
    existing.e = I(Math.max(dn, existing.e ? N(existing.e) : dn));
    save();
    ui.conflict = null;
    haptic(15);
    toast("Period duration extended");
  },
  conflictClose: () => {
    ui.conflict = null;
    haptic(10);
  },
  goLog: v => {
    loadDraft(v);
    scrollPositions[ui.tab] = window.scrollY;
    ui.tab = "log";
    haptic(10);
  },
  quickDate: v => {
    loadDraft(v);
    haptic(10);
  },
  ldate: (v, b) => {
    loadDraft(b.value || I(TD()));
    haptic(10);
  },
  flow: v => {
    G.dr.f = G.dr.f == v ? "" : v;
    haptic(15);
  },
  dm: v => {
    G.dr.m = G.dr.m === +v ? null : +v;
    haptic(15);
  },
  energy: v => {
    G.dr.en = G.dr.en === v ? "" : v;
    haptic(15);
  },
  sleepQ: v => {
    G.dr.sq = G.dr.sq === v ? "" : v;
    haptic(15);
  },
  med: v => {
    tg(G.dr.med, v);
    haptic(15);
  },
  lh: v => {
    G.dr.lh = G.dr.lh === v ? "" : v;
    haptic(15);
  },
  sym: v => {
    const s = G.dr.sy;
    const n = ((s[v] || 0) + 1) % 4;
    n ? (s[v] = n) : delete s[v];
    haptic(15);
  },
  addc: () => {
    const e = $("#cs");
    const v = e.value.trim().slice(0, 30);
    if (v && ![...SY, ...S.custom].includes(v)) {
      S.custom.push(v);
      G.dr.sy[v] = 1;
      e.value = "";
      save();
      haptic([15, 30]);
      toast("Added: " + v);
    }
  },
  save: () => {
    const d = G.dr;
    const o = {
      m: d.m,
      p: d.p,
      en: d.en,
      sl: d.sl,
      sq: d.sq,
      med: d.med.length ? [...d.med] : undefined,
      bbt: d.bbt ? d.bbt.trim() : undefined,
      lh: d.lh || undefined,
      sy: { ...d.sy },
      note: d.note.trim(),
      f: d.f
    };
    const hasData = o.m != null || o.p != null || o.en || o.sl != null || o.sq ||
      (o.med && o.med.length) || o.bbt || o.lh || Object.keys(o.sy).length || o.note || (o.f && o.f !== "none");
    if (!hasData) {
      toast("Nothing to save yet");
      return;
    }
    S.logs[d.d] = o;
    if (o.f && o.f !== "none" && o.f !== "spotting") {
      requestPeriodStart(N(d.d));
    } else {
      save();
    }
    haptic([20, 60, 20]);
    toast("Entry saved for " + fmt(N(d.d)));
    ui.tab = "home";
  },
  toggleBreath: () => {
    ui.breath = !ui.breath;
    haptic(15);
  },
  th: v => {
    S.theme = v;
    save();
    applyTheme();
    fav();
    haptic(15);
  },
  rk: v => {
    S.rk[v] = +!S.rk[v];
    save();
    haptic(15);
  },
  dis: v => {
    S.dis[v] = I(TD());
    save();
    haptic(10);
  },
  pr: () => {
    S.rem = +!S.rem;
    if (S.rem) askNotif();
    save();
    haptic(15);
  },
  exportCSV: () => {
    haptic(15);
    const headers = ["Date", "Type", "Flow", "Mood", "Pain_0_10", "Energy", "Sleep_Hours", "Sleep_Quality", "Medications", "BBT", "LH_Test", "Symptoms", "Notes"];
    const rows = [];
    const dates = new Set([...Object.keys(S.logs)]);
    vp().forEach(p => {
      for (let d = N(p.s); d <= pEnd(p); d++) dates.add(I(d));
    });
    const sortedDates = [...dates].sort();
    const ps = pdset();

    sortedDates.forEach(d => {
      const l = S.logs[d] || {};
      const isPeriod = ps.has(N(d));
      const symList = Object.entries(l.sy || {}).map(([k, v]) => `${k}:${["mild","mod","sev"][v-1] || v}`).join("; ");
      const medsList = Array.isArray(l.med) ? l.med.join("; ") : (l.med || "");
      const row = [
        d,
        isPeriod ? "Period Day" : "Log Entry",
        l.f || (isPeriod ? "recorded" : ""),
        l.m != null ? (MOODS[l.m] ? MOODS[l.m].name : l.m) : "",
        l.p != null ? l.p : "",
        l.en || "",
        l.sl != null ? l.sl : "",
        l.sq || "",
        `"${medsList.replace(/"/g, '""')}"`,
        l.bbt || "",
        l.lh || "",
        `"${symList.replace(/"/g, '""')}"`,
        `"${(l.note || "").replace(/"/g, '""')}"`
      ];
      rows.push(row.join(","));
    });

    const csvContent = [headers.join(","), ...rows].join("\r\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `CycleSideChick_Export_${I(TD())}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("CSV export downloaded");
  },
  copyJSON: async () => {
    const e = $("#ex");
    e.select();
    try {
      await navigator.clipboard.writeText(e.value);
      haptic([20, 40]);
      toast("JSON records copied to clipboard");
    } catch (x) {
      toast("Press copy on selected text");
    }
  },
  wipe: () => {
    if (ui.cf != "wipe") {
      ui.cf = "wipe";
      haptic(20);
      return;
    }
    Object.keys(S).forEach(k => delete S[k]);
    Object.assign(S, def());
    applyTheme();
    try {
      localStorage.removeItem(KEY);
    } catch (x) {}
    ui.prof = 0;
    ui.cf = "";
    G.ob.step = 0;
    loadDraft(I(TD()));
    fav();
    haptic([30, 60, 30]);
    toast("All data deleted");
  }
};

/* Event Listeners */
function askNotif() {
  try {
    if ("Notification" in window && Notification.permission == "default") {
      Notification.requestPermission().then(() => {
        render();
        tick();
      });
    }
  } catch (e) {}
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b || b.tagName == "INPUT") return;
  const f = A[b.dataset.a];
  if (f) {
    f(b.dataset.v, b);
    if (!S.ob || b.dataset.a != "copyJSON") render();
  }
});

const LIM = { "S.cl": [15, 90], "S.pl": [1, 14], "S.ll": [10, 16], "ob.cl": [15, 90], "ob.pl": [1, 14] };

function onIn(e) {
  const el = e.target;
  const k = el.dataset.k;

  if (el.dataset.a == "ldate" && e.type == "change") {
    A.ldate(0, el);
    render();
    return;
  }

  if (!k || (e.type == "change" && !el.dataset.r)) return;
  let v = el.value;
  if (el.type == "number" || el.type == "range") {
    v = +v;
    const l = LIM[k];
    if (l && !(v >= l[0] && v <= l[1])) return;
  }

  const p = k.split(".");
  let o = G;
  while (p.length > 1) o = o[p.shift()];
  o[p[0]] = v;

  if (el.dataset.out) {
    const target = document.getElementById(el.dataset.out);
    if (target) {
      if (k === "dr.p") {
        target.textContent = v + "/10 · " + (v === 0 ? "No pain" : v <= 3 ? "Mild" : v <= 6 ? "Moderate" : v <= 8 ? "Severe" : "Very severe");
      } else {
        target.textContent = v + " h";
      }
    }
  }

  if (k.startsWith("S.")) save();
  if (el.dataset.r) render();
}

document.addEventListener("input", onIn);
document.addEventListener("change", onIn);
document.addEventListener("keydown", e => {
  if (e.key == "Escape") {
    if (ui.clinicianModal) { ui.clinicianModal = false; render(); }
    else if (ui.conflict) { ui.conflict = null; render(); }
    else if (ui.prof) { ui.prof = 0; render(); }
  }
});

/* Theme, Dynamic Meta & Favicon */
function applyTheme() {
  const r = document.documentElement;
  const isDark = S.theme === "dark" || (S.theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  if (S.theme == "light" || S.theme == "dark") {
    r.dataset.theme = S.theme;
  } else {
    r.removeAttribute("data-theme");
  }
  const meta = $("#meta-theme");
  if (meta) meta.content = isDark ? "#17151B" : "#FAF5F7";
}

function due() {
  const x = stats();
  const T = TD();
  const k = I(T);
  const o = [];
  if (!S.ob || !S.rem) return o;

  if (S.rk.prep && x.last != null) {
    const u = x.pred[0] - T;
    if (u >= 0 && u <= S.rp && T - x.last >= S.pl) {
      o.push({
        id: "p" + k,
        t: "Period estimated " + (u ? "in about " + u + " day" + (u > 1 ? "s" : "") : "today"),
        b: "Supplies reminder. CycleSideChick estimates are rough guides."
      });
    }
  }

  const L = S.logs[k];
  if (S.rk.log && !(L && Object.keys(L).length) && new Date().toTimeString().slice(0, 5) >= S.rt) {
    o.push({
      id: "l" + k,
      t: "Daily check-in",
      b: "Log your symptoms or feelings today."
    });
  }
  return o;
}

function tick(f) {
  const k = I(TD());
  if (ui.day != k) {
    ui.day = k;
    ui.sel = TD();
    const n = new Date();
    ui.cm = { y: n.getFullYear(), m: n.getMonth() };
    if (ui.tab != "log") loadDraft(k);
    render();
  } else if (f === true) {
    render();
  }

  try {
    if (S.rem && "Notification" in window && Notification.permission == "granted") {
      due().forEach(r => {
        if (!S.sent[r.id]) {
          S.sent[r.id] = 1;
          new Notification("CycleSideChick", { body: r.t + ". " + r.b });
        }
      });
      Object.keys(S.sent).forEach(i => {
        if (!i.endsWith(k)) delete S.sent[i];
      });
      save();
    }
  } catch (e) {}
}

const fav = () => {
  const isDark = document.documentElement.dataset.theme === "dark" ||
    (S.theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const colors = isDark
    ? { plum: "#F6EDF3", surface: "#2A2330", rose: "#9C657A", pink: "#EB6FA1" }
    : { plum: "#481930", surface: "#F7EDF2", rose: "#C68196", pink: "#D9447E" };

  const svg = bunny(64, 0)
    .replace(/var\(--plum\)/g, colors.plum)
    .replace(/var\(--surface-alt\)/g, colors.surface)
    .replace(/var\(--rose\)/g, colors.rose)
    .replace(/var\(--pink\)/g, colors.pink)
    .replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');

  const el = $("#fv");
  if (el) el.href = "data:image/svg+xml," + encodeURIComponent(svg);
};

/* Initialization */
ui.day = I(TD());
applyTheme();
fav();
setInterval(tick, 6e4);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) tick(true);
});
tick();
render();
</script>
</body>
</html>
